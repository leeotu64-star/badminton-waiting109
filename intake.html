<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장군봉체육관 시설·환경·안전 접수</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:"Malgun Gothic",Arial,sans-serif;color:#172033}.wrap{max-width:760px;margin:0 auto;padding:24px}.head{background:#071d3a;color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}.head h1{margin:0;font-size:24px}.head p{margin:7px 0 0;font-size:13px;opacity:.85}.panel{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:18px;box-shadow:0 4px 14px #15233a0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:13px;font-weight:800}select,textarea,input[type=file]{border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:#fff;font:inherit}textarea{min-height:130px;resize:vertical}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px;background:#1769c1;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.notice{background:#f4f8ff;border-left:4px solid #1769c1;padding:11px;margin-bottom:12px;font-size:12px;line-height:1.6}.ok{display:none;margin-top:12px;background:#effaf3;color:#13753a;padding:12px;border-radius:9px;font-weight:800}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="head"><h1>📱 장군봉체육관 시설·환경·안전 접수</h1><p>접수자 이름은 저장하지 않습니다. 접수시간은 자동 기록됩니다.</p></div><div class="notice">장소를 선택하고 내용을 입력하면 직원·관리자 화면에 실시간으로 전달됩니다.</div><div class="panel"><div class="grid"><div class="field"><label>구분</label><select id="cat"><option>시설</option><option>환경</option><option>안전</option><option>기타</option></select></div><div class="field"><label>접수 장소</label><select id="place"><option value="">장소를 선택하세요</option><option>남자 탈의실</option><option>여자 탈의실</option><option>남자 화장실</option><option>여자 화장실</option><option>코트 1</option><option>코트 2</option><option>코트 3</option><option>코트 4</option><option>코트 5</option><option>복도</option><option>휴게실</option><option>기타</option></select></div><div class="field full"><label>접수사항</label><textarea id="content" placeholder="시설 고장, 환경 문제, 안전 관련 사항 등을 입력하세요"></textarea></div><div class="field full"><label>사진 (선택)</label><input id="photo" type="file" accept="image/*"></div></div><button id="btn" class="btn" onclick="submitIntake()">접수하기</button><div id="ok" class="ok">✓ 접수되었습니다. 직원 화면에 실시간으로 전달됩니다.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";const SUPA=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);async function submitIntake(){const cat=document.getElementById("cat").value,place=document.getElementById("place").value,content=document.getElementById("content").value.trim(),btn=document.getElementById("btn");if(!place||!content){alert("접수 장소와 접수사항을 입력하세요.");return}btn.disabled=true;try{let photo_url="";const f=document.getElementById("photo").files[0];if(f){const path=Date.now()+"_"+f.name.replace(/[^\w가-힣.\-]/g,"_");const up=await SUPA.storage.from("request-photos").upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+"/storage/v1/object/public/request-photos/"+path}const r=await SUPA.from("requests").insert({category:cat,place,content,photo_url,status:"접수",received_at:new Date().toISOString()});if(r.error)throw r.error;document.getElementById("content").value="";document.getElementById("place").value="";document.getElementById("photo").value="";document.getElementById("ok").style.display="block"}catch(e){console.error(e);alert("접수에 실패했습니다. Supabase 설정을 확인하세요.")}finally{btn.disabled=false}}</script></body></html>
