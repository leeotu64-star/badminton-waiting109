const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";
const SUPA=(window.supabase&&typeof window.supabase.createClient==="function")?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;

 {id:"w1",name:"김민수",shift:"새벽조",start:"06:00",end:"15:00"},

function employeePage(){let opts='<option value="">신고자를 선택하세요</option>';workers.forEach(function(w){opts+='<option value="'+w.id+'">'+w.name+'</option>'});return '<div class="wrap"><div class="brand"><small>JANGGUNBONG GYMNASIUM</small><h1>시설 이상 신고</h1><p>직원 신고 → 관리자 작업관리 자동 전달</p></div><div id="ok" class="ok">✓ 신고가 등록되었습니다. 관리자 작업관리로 전달되었습니다.</div><div class="card"><div class="step"><i>1</i><div><b>신고자</b><small>신고한 직원의 이름을 선택합니다.</small></div></div><div class="field"><label>신고자 <em>필수</em></label><select id="reporter">'+opts+'</select></div><div class="field"><label>신고 분야 <em>필수</em></label><select id="category"><option>시설</option><option>전기</option><option>소방</option><option>냉난방</option><option>누수</option><option>안전</option><option>환경</option><option>기타</option></select></div><div class="field"><label>발생 위치 <em>필수</em></label><input id="place" placeholder="예: 지하 기계실, 2층 3번 코트"></div><div class="step"><i>2</i><div><b>이상 내용</b><small>현장에서 확인한 내용을 입력</small></div></div><div class="field"><label>고장·이상 내용 <em>필수</em></label><textarea id="content" placeholder="예: 천장에서 물이 떨어집니다."></textarea></div><div class="step"><i>3</i><div><b>현장 사진</b><small>필요한 경우 바로 촬영</small></div></div><div class="field photo"><input id="photo" type="file" accept="image/*" capture="environment"></div><button id="submit" class="submit" onclick="submitReport()">신고 등록</button><div class="foot">등록된 신고는 관리자 작업관리로 자동 접수됩니다.</div></div></div>'}
async function submitReport(){const reporterId=document.getElementById('reporter')?.value||'',reporter=workers.find(w=>w.id===reporterId)?.name||'',category=document.getElementById('category')?.value||'기타',place=document.getElementById('place')?.value.trim()||'',content=document.getElementById('content')?.value.trim()||'',btn=document.getElementById('submit');if(!reporter){alert('신고자를 선택하세요.');return}if(!place){alert('발생 위치를 입력하세요.');return}if(!content){alert('고장·이상 내용을 입력하세요.');return}if(!SUPA){alert('Supabase 연결이 필요합니다.');return}btn.disabled=true;btn.textContent='등록 중...';try{let photo_url='';const f=document.getElementById('photo')?.files?.[0];if(f){const safe=f.name.replace(/[^\w가-힣.\-]/g,'_'),path=Date.now()+'_'+safe,up=await SUPA.storage.from('request-photos').upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+'/storage/v1/object/public/request-photos/'+path}const tagged='[[신고자:'+reporter+']] '+content,r=await SUPA.from('requests').insert({category,place,content:tagged,photo_url,status:'접수',received_at:new Date().toISOString()});if(r.error)throw r.error;document.getElementById('ok').style.display='block';document.getElementById('place').value='';document.getElementById('content').value='';document.getElementById('photo').value='';window.scrollTo({top:0,behavior:'smooth'})}catch(e){console.error(e);alert('신고 등록에 실패했습니다.\n'+(e&&e.message?e.message:'Supabase 연결 또는 권한을 확인하세요.'))}finally{btn.disabled=false;btn.textContent='신고 등록'}}document.getElementById('app').innerHTML=employeePage();</script></body></html>
