ㅇdㅇㅇ<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f7fb;color:#172033;font-family:"Malgun Gothic",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
.employee-shell{width:100%;max-width:560px;margin:0 auto;min-height:100vh;padding:18px 14px 34px}
.employee-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.employee-brand{font-size:13px;font-weight:900;color:#163b70;letter-spacing:.02em}
.employee-status{font-size:10px;font-weight:800;color:#138a42;background:#eaf8ef;border-radius:999px;padding:6px 9px}
.hero{background:linear-gradient(145deg,#12386b 0%,#1d65b3 100%);color:#fff;border-radius:24px;padding:23px 21px 22px;box-shadow:0 12px 30px rgba(18,56,107,.18);margin-bottom:13px}
.hero .eyebrow{font-size:10px;font-weight:900;opacity:.75;letter-spacing:.08em}
.hero h1{font-size:25px;line-height:1.2;margin:7px 0 8px;font-weight:1000;letter-spacing:-.04em}
.hero p{margin:0;font-size:12px;line-height:1.55;opacity:.9}
.form-card{background:#fff;border:1px solid #e0e7f0;border-radius:22px;padding:17px;box-shadow:0 5px 20px rgba(15,23,42,.05)}
.section{padding:3px 0 16px}
.section+.section{border-top:1px solid #edf1f5;padding-top:17px}
.section-title{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.section-no{width:27px;height:27px;border-radius:50%;background:#12386b;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:1000;flex:none}
.section-title b{font-size:14px}
.section-title small{display:block;color:#748095;font-size:10px;font-weight:500;margin-top:2px}
.field{margin-top:11px}
.field:first-of-type{margin-top:0}
.field label{display:block;font-size:11px;font-weight:900;color:#334155;margin-bottom:6px}
.field label em{font-style:normal;color:#e11d48;font-size:9px;margin-left:3px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d5deea;background:#fbfcfe;border-radius:11px;padding:12px 12px;font-size:13px;color:#172033;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#4d8ed6;box-shadow:0 0 0 3px rgba(77,142,214,.12);background:#fff}
.field textarea{min-height:112px;resize:vertical;line-height:1.55}
.photo-box{border:1px dashed #b9c9dc;background:#f8fbff;border-radius:12px;padding:12px}
.photo-box input{border:0;padding:0;background:transparent}
.submit{width:100%;height:54px;border:0;border-radius:14px;background:#1769c1;color:#fff;font-size:16px;font-weight:1000;cursor:pointer;box-shadow:0 8px 18px rgba(23,105,193,.22);margin-top:2px}
.submit:disabled{opacity:.6;cursor:wait}
.ok{display:none;background:#eaf8ef;border:1px solid #a9d9ba;color:#147b3b;border-radius:14px;padding:13px 14px;margin-bottom:12px;font-size:12px;font-weight:800;line-height:1.5}
.foot{text-align:center;color:#7b8798;font-size:10px;line-height:1.5;margin-top:10px}
@media(min-width:700px){.employee-shell{padding-top:34px}.hero h1{font-size:29px}}
</style><title>장군봉체육관 직원 신고</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div id="app"></div><script>const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";
const SUPA=(window.supabase&&typeof window.supabase.createClient==="function")?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;

const workers=[
 {id:"w1",name:"김민수",shift:"새벽조",start:"06:00",end:"15:00"},
 {id:"w2",name:"이현우",shift:"오전조",start:"09:00",end:"18:00"},
 {id:"w3",name:"박성훈",shift:"오후조",start:"13:30",end:"22:30"},
 {id:"w4",name:"최지훈",shift:"-",start:"",end:""}
];
function employeePage(){
  let opts='<option value="">신고자를 선택하세요</option>';
  workers.forEach(function(w){opts+='<option value="'+w.id+'">'+w.name+'</option>'});
  return `<div class="employee-shell">
    <div class="employee-top">
      <div class="employee-brand">JANGGUNBONG GYMNASIUM</div>
      <div class="employee-status">직원 신고</div>
    </div>
    <div class="hero">
      <div class="eyebrow">FACILITY ISSUE REPORT</div>
      <h1>시설 이상 신고</h1>
      <p>현장에서 이상을 발견하면 간단하게 등록하세요.<br>등록 즉시 관리자 작업관리로 전달됩니다.</p>
    </div>
    <div id="ok" class="ok">✓ 신고가 등록되었습니다.<br>관리자 작업관리로 정상 전달되었습니다.</div>
    <div class="form-card">
      <div class="section">
        <div class="section-title"><i class="section-no">1</i><div><b>신고 정보</b><small>신고자와 발생 위치를 입력하세요.</small></div></div>
        <div class="field"><label>신고자 <em>필수</em></label><select id="reporter">${opts}</select></div>
        <div class="field"><label>신고 분야 <em>필수</em></label><select id="category"><option>시설</option><option>전기</option><option>소방</option><option>냉난방</option><option>누수</option><option>안전</option><option>환경</option><option>기타</option></select></div>
        <div class="field"><label>발생 위치 <em>필수</em></label><input id="place" placeholder="예: 2층 3번 코트 / 지하 기계실"></div>
      </div>
      <div class="section">
        <div class="section-title"><i class="section-no">2</i><div><b>이상 내용</b><small>확인한 내용을 구체적으로 입력하세요.</small></div></div>
        <div class="field"><label>고장·이상 내용 <em>필수</em></label><textarea id="content" placeholder="예: 천장에서 물이 떨어집니다."></textarea></div>
      </div>
      <div class="section">
        <div class="section-title"><i class="section-no">3</i><div><b>현장 사진</b><small>필요한 경우 현장에서 바로 촬영할 수 있습니다.</small></div></div>
        <div class="field photo-box"><input id="photo" type="file" accept="image/*" capture="environment"></div>
      </div>
      <button id="submit" class="submit" onclick="submitReport()">신고 등록</button>
      <div class="foot">신고 등록 → 관리자 작업관리 → 담당자 조치완료</div>
    </div>
  </div>`
}
async function submitReport(){const reporterId=document.getElementById('reporter')?.value||'',reporter=workers.find(w=>w.id===reporterId)?.name||'',category=document.getElementById('category')?.value||'기타',place=document.getElementById('place')?.value.trim()||'',content=document.getElementById('content')?.value.trim()||'',btn=document.getElementById('submit');if(!reporter){alert('신고자를 선택하세요.');return}if(!place){alert('발생 위치를 입력하세요.');return}if(!content){alert('고장·이상 내용을 입력하세요.');return}if(!SUPA){alert('Supabase 연결에 실패했습니다. 인터넷 연결과 Supabase 설정을 확인하세요.');return}btn.disabled=true;btn.textContent='등록 중...';try{let photo_url='';const f=document.getElementById('photo')?.files?.[0];if(f){const safe=f.name.replace(/[^\w가-힣.\-]/g,'_'),path=Date.now()+'_'+safe,up=await SUPA.storage.from('request-photos').upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+'/storage/v1/object/public/request-photos/'+path}const tagged='[[신고자:'+reporter+']] '+content,r=await SUPA.from('requests').insert({category,place,content:tagged,photo_url,status:'접수',received_at:new Date().toISOString()});if(r.error)throw r.error;document.getElementById('ok').style.display='block';document.getElementById('place').value='';document.getElementById('content').value='';document.getElementById('photo').value='';window.scrollTo({top:0,behavior:'smooth'})}catch(e){console.error(e);alert('신고 등록에 실패했습니다.\n'+(e&&e.message?e.message:'Supabase 연결 또는 권한을 확인하세요.'))}finally{btn.disabled=false;btn.textContent='신고 등록'}}document.getElementById('app').innerHTML=employeePage();</script></body></html>
