<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>누수 배치도 LIVE 70:30 최종 수정</title>
<style>
/* 누수현황 최종 수정
   배치도 70% : LIVE 30%
   한 줄 고정
   배치도와 LIVE 상단/하단 동일
*/

.jgb-v170-grid{
  display:grid!important;
  grid-template-columns:minmax(0,7fr) minmax(0,3fr)!important;
  grid-template-rows:minmax(0,1fr)!important;
  width:100%!important;
  height:750px!important;
  min-width:0!important;
  min-height:0!important;
  column-gap:14px!important;
  row-gap:0!important;
  align-items:stretch!important;
  justify-items:stretch!important;
  overflow:hidden!important;
}

.jgb-v170-grid > .jgb-v170-mapcard{
  grid-column:1!important;
  grid-row:1!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  max-width:none!important;
  max-height:none!important;
  margin:0!important;
  padding:0!important;
  align-self:stretch!important;
  justify-self:stretch!important;
  box-sizing:border-box!important;
}

.jgb-v170-grid > .jgb-v170-live{
  grid-column:2!important;
  grid-row:1!important;
  display:block!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  max-width:none!important;
  max-height:none!important;
  margin:0!important;
  padding:0!important;
  align-self:stretch!important;
  justify-self:stretch!important;
  box-sizing:border-box!important;
  overflow:hidden!important;
}

.jgb-v170-grid > .jgb-v170-live .jgb-v176-live-card{
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  max-width:none!important;
  max-height:none!important;
  margin:0!important;
  box-sizing:border-box!important;
}

.jgb-v170-grid > .jgb-v170-live .jgb-v178-live-register,
.jgb-v170-grid > .jgb-v170-live .jgb-v178-live-table{
  width:100%!important;
  min-width:0!important;
  min-height:0!important;
  max-width:none!important;
  box-sizing:border-box!important;
}

.jgb-v170-grid > .jgb-v170-live .jgb-v178-live-table{
  overflow:auto!important;
}

@media(max-width:1000px){
  .jgb-v170-grid{
    grid-template-columns:minmax(0,7fr) minmax(0,3fr)!important;
    grid-template-rows:minmax(0,1fr)!important;
    width:100%!important;
    height:750px!important;
    column-gap:14px!important;
    row-gap:0!important;
  }
}

@media(max-width:700px){
  .jgb-v170-grid{
    grid-template-columns:minmax(0,7fr) minmax(0,3fr)!important;
    grid-template-rows:minmax(0,1fr)!important;
    width:100%!important;
    height:750px!important;
    column-gap:14px!important;
    row-gap:0!important;
  }
}

</style>
</head>
<body>
  <div class="jgb-v170-grid">
    <div class="jgb-v170-mapcard">기존 누수 배치도 영역</div>
    <div class="jgb-v170-live">기존 LIVE 영역</div>
  </div>
</body>
</html>
