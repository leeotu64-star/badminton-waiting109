<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAM 6:4 Layout</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  min-width: 0;
  min-height: 0;
}

/* 전체 화면: 상단 60% / 하단 40% */
.main-content {
  width: 100%;
  height: 100dvh;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  overflow: hidden;
}

/* 상단 영역 60% */
.top-section {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* 하단 영역 40% */
.bottom-section {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

/* 내부 콘텐츠가 영역을 밀어내지 않도록 */
.top-section > *,
.bottom-section > * {
  min-width: 0;
  min-height: 0;
}

/* 좌우 분할은 50:50 유지 */
.top-section .split,
.bottom-section .split {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

/* 접수·민원 처리 목록 좌우 50:50 */
.reception-list {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  overflow: hidden;
}

/* 표가 가로로 밀리지 않도록 */
table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* 화면 크기가 달라도 60:40 유지 */
@media (max-width: 1200px) {
  .main-content {
    height: 100dvh;
    grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  }
}

@media (max-width: 800px) {
  .main-content {
    height: 100dvh;
    grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  }
}
</style>
</head>
<body>

<div class="main-content">
  <section class="top-section">
    <!-- 기존 상단 EAM 화면을 이 영역에 유지 -->
  </section>

  <section class="bottom-section">
    <!-- 기존 하단 EAM 화면을 이 영역에 유지 -->
  </section>
</div>

</body>
</html>
