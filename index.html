<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장군봉체육관 EAM 독립형 관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;background:#eef5f9;color:#17324a}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.header{height:82px;background:#11577d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 3px 12px #0002}
.title{font-size:25px;font-weight:900}
.sub{font-size:12px;opacity:.82;margin-top:4px}
.actions{display:flex;gap:9px}
.btn{border:1px solid #fff5;border-radius:9px;padding:11px 16px;font-weight:800;background:#fff;color:#145d83}
.btn.dark{background:#194e6d;color:#fff;border-color:#ffffff55}
.btn.danger{background:#fff1f1;color:#d33;border-color:#ffd1d1}
.main{padding:18px}
.panel{background:#fff;border:1px solid #bfd1dd;border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #0000000d}
.panelHead{padding:13px 17px;background:#edf5f9;border-bottom:1px solid #cbdbe5;font-weight:900}
.categories{display:grid;grid-template-columns:repeat(9,minmax(100px,1fr));gap:10px;margin-bottom:14px}
.cat{border:1px solid #c8d9e5;background:#fff;border-radius:11px;padding:12px 8px;text-align:center;min-height:82px}
.cat:hover{border-color:#1674c8}
.cat.active{outline:2px solid #1674c8;background:#f2f8ff}
.cat .icon{font-size:28px}.cat .name{font-weight:900;margin-top:4px}.cat .prefix{font-size:11px;color:#71899b;margin-top:2px}
.content{display:grid;grid-template-columns:1.65fr .8fr;gap:14px}
.mapWrap{position:relative;min-height:620px;background:#f5fafc;border:1px solid #b8cbd8;overflow:hidden}
.map{position:absolute;inset:0}
.room{position:absolute;border:1px solid #9fb8c7;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#31566d}
.r1{left:0;top:0;width:20%;height:32%}.r2{left:20%;top:0;width:20%;height:32%}.r3{left:40%;top:0;width:20%;height:32%}
.r4{left:60%;top:0;width:20%;height:32%}.r5{left:80%;top:0;width:20%;height:32%}
.r6{left:0;top:32%;width:20%;height:38%}.r7{left:20%;top:32%;width:20%;height:38%}.r8{left:40%;top:32%;width:20%;height:38%}
.r9{left:60%;top:32%;width:20%;height:38%}.r10{left:80%;top:32%;width:20%;height:38%}
.corridor{position:absolute;left:0;right:0;top:70%;height:12%;background:#f7f0df;border-top:1px solid #c9bda5;border-bottom:1px solid #c9bda5;text-align:center;padding-top:17px;font-weight:900}
.mapNote{position:absolute;left:15px;bottom:15px;font-size:12px;color:#6b8292;background:#fff;padding:8px 11px;border-radius:8px;border:1px solid #d2e0e8}
.mapIcon{position:absolute;min-width:72px;padding:6px 9px;border:2px solid #12a66b;border-radius:18px;background:#fff;box-shadow:0 5px 14px #0002;z-index:20;user-select:none;touch-action:none}
.mapIcon.dragging{cursor:grabbing;opacity:.75;box-shadow:0 9px 24px #0003}
.mapIcon .code{font-weight:900;font-size:13px;color:#0c69ad;text-align:center}
.mapIcon .type{font-size:9px;color:#6b8292;text-align:center;margin-top:2px}
.side{display:flex;flex-direction:column;gap:14px}
.codeList{padding:12px;max-height:520px;overflow:auto}
.codeRow{display:flex;align-items:center;justify-content:space-between;border:1px solid #d1e0e9;border-radius:9px;padding:10px 11px;margin-bottom:8px;background:#fff}
.codeRow .code{font-weight:900;color:#086bb3}.codeRow .del{border:0;border-radius:7px;padding:7px 10px;background:#fff0f0;color:#d33;font-weight:800}
.empty{text-align:center;color:#8195a4;padding:35px 10px}
.modalBack{position:fixed;inset:0;background:#102b3e88;display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{width:min(520px,94vw);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 25px 80px #0004}
.modalHead{background:#155f84;color:#fff;padding:16px 19px;display:flex;justify-content:space-between;align-items:center}
.modalHead strong{font-size:20px}.close{border:0;background:#ffffff1c;color:#fff;font-size:22px;width:35px;height:35px;border-radius:8px}
.modalBody{padding:17px}.modalBody label{display:block;font-size:12px;font-weight:800;color:#526d80;margin-bottom:7px}
.addLine{display:flex;gap:8px;align-items:center}.addLine input{width:110px;padding:11px;border:1px solid #b9ccd9;border-radius:8px}
.addLine button{border:0;background:#1674c8;color:#fff;padding:11px 14px;border-radius:8px;font-weight:900}
.hint{font-size:11px;color:#788f9f;margin-top:9px}
@media(max-width:1050px){.categories{grid-template-columns:repeat(5,1fr)}.content{grid-template-columns:1fr}.mapWrap{min-height:500px}}
@media(max-width:650px){.categories{grid-template-columns:repeat(3,1fr)}.header{height:auto;padding:14px;gap:10px;align-items:flex-start}.actions{flex-wrap:wrap}.title{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div><div class="title">🏢 장군봉체육관 · EAM 코드/아이콘 관리</div><div class="sub">독립형 · 자산등록 / 제조사 / 모델 / 이력카드 / 수리LIVE 연동 없음</div></div>
  <div class="actions">
    <button class="btn" id="codeOpen">＋ 코드 생성·삭제</button>
    <button class="btn dark" id="iconDeleteOpen">🗑 아이콘 삭제</button>
  </div>
</header>
<main class="main">
  <div class="categories" id="categories"></div>
  <div class="content">
    <section class="panel">
      <div class="panelHead">시설 배치도 <span style="font-size:11px;font-weight:400;color:#71899b">· 아이콘은 마우스로 드래그하여 이동</span></div>
      <div class="mapWrap" id="mapWrap">
        <div class="map">
          <div class="room r1">옥상</div><div class="room r2">옥상</div><div class="room r3">창고</div><div class="room r4">계단</div><div class="room r5">옥상</div>
          <div class="room r6">샤워실(남)</div><div class="room r7">화장실(남)</div><div class="room r8">탈의실(남)</div><div class="room r9">샤워실(여)</div><div class="room r10">탈의실(여)</div>
          <div class="corridor">복도</div>
        </div>
        <div class="mapNote">아이콘을 원하는 위치에 드래그하세요. 위치는 이 브라우저에 저장됩니다.</div>
        <div id="icons"></div>
      </div>
    </section>
    <aside class="side">
      <section class="panel">
        <div class="panelHead" id="listTitle">냉난방 코드</div>
        <div class="codeList" id="codeList"></div>
      </section>
      <section class="panel">
        <div class="panelHead">현재 선택 분류</div>
        <div style="padding:15px;font-size:13px;color:#667f90">
          <b id="selectedInfo">AC · 냉난방</b><br><br>
          코드는 이 화면에서만 생성·삭제됩니다.<br>
          코드와 아이콘은 서로 자동 연동되지 않습니다.
        </div>
      </section>
    </aside>
  </div>
</main>
</div>

<div id="modalRoot"></div>

<script>
(function(){
'use strict';

const CATS=[
 {id:'cooling',name:'냉난방',prefix:'AC',icon:'❄️'},
 {id:'fire',name:'소방·방재',prefix:'FI',icon:'🚒'},
 {id:'water',name:'온수·난방',prefix:'BO',icon:'♨️'},
 {id:'electrical',name:'전기설비',prefix:'EL',icon:'⚡'},
 {id:'lighting',name:'코트조명',prefix:'LT',icon:'💡'},
 {id:'waterproof',name:'방수',prefix:'WP',icon:'🏗️'},
 {id:'sanitary',name:'위생설비',prefix:'SA',icon:'🚻'},
 {id:'doors',name:'문·창호설비',prefix:'DR',icon:'🚪'},
 {id:'other',name:'기타설비',prefix:'OT',icon:'🧰'}
];

const CODE_KEY='JGB_EAM_INDEPENDENT_CODES_V20';
const ICON_KEY='JGB_EAM_INDEPENDENT_ICONS_V20';
let selected='cooling';

function load(key, fallback){
 try{const x=JSON.parse(localStorage.getItem(key));return x??fallback}catch(e){return fallback}
}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function cfg(){return CATS.find(x=>x.id===selected)||CATS[0]}
function fmt(prefix,n){return prefix+'-'+String(n).padStart(2,'0')}

function renderCats(){
 const el=document.getElementById('categories');
 el.innerHTML=CATS.map(c=>`
   <button class="cat ${c.id===selected?'active':''}" data-cat="${c.id}">
    <div class="icon">${c.icon}</div><div class="name">${c.name}</div><div class="prefix">${c.prefix}-01 형식</div>
   </button>`).join('');
 el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;renderCats();renderCodes()});
}

function codesFor(cat){
 const d=load(CODE_KEY,{});
 return Array.isArray(d[cat])?d[cat].map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=99).sort((a,b)=>a-b):[];
}

function renderCodes(){
 const c=cfg(), arr=codesFor(selected);
 document.getElementById('listTitle').textContent=c.name+' 코드';
 document.getElementById('selectedInfo').textContent=c.prefix+' · '+c.name;
 document.getElementById('codeList').innerHTML=arr.length?arr.map(n=>`
  <div class="codeRow"><span class="code">${fmt(c.prefix,n)}</span>
  <button class="del" data-n="${n}">삭제</button></div>`).join(''):'<div class="empty">등록된 코드가 없습니다.</div>';
 document.querySelectorAll('#codeList .del').forEach(b=>b.onclick=()=>deleteCode(selected,Number(b.dataset.n)));
}

function addCode(cat,n){
 const d=load(CODE_KEY,{}), arr=Array.isArray(d[cat])?d[cat].map(Number):[];
 if(arr.includes(n)){alert(fmt(CATS.find(x=>x.id===cat).prefix,n)+'는 이미 등록되어 있습니다.');return}
 arr.push(n);d[cat]=arr;save(CODE_KEY,d);renderCodes();renderIcons();
}

function deleteCode(cat,n){
 const c=CATS.find(x=>x.id===cat);
 if(!confirm(fmt(c.prefix,n)+' 코드만 삭제할까요?\n아이콘과 다른 분류의 코드는 건드리지 않습니다.'))return;
 const d=load(CODE_KEY,{});d[cat]=(Array.isArray(d[cat])?d[cat]:[]).filter(x=>Number(x)!==n);
 save(CODE_KEY,d);renderCodes();
 // 중요: 코드 삭제는 아이콘 삭제와 독립. 아이콘은 그대로 둔다.
}

function openCodeModal(){
 const c=cfg();
 document.getElementById('modalRoot').innerHTML=`
 <div class="modalBack" id="codeModal"><div class="modal">
  <div class="modalHead"><strong>${c.name} · 코드 관리</strong><button class="close" id="cmx">×</button></div>
  <div class="modalBody">
   <div id="modalCodes"></div>
   <label style="margin-top:13px">${c.prefix}- 뒤 숫자만 입력</label>
   <div class="addLine"><b>${c.prefix}-</b><input id="newNum" inputmode="numeric" maxlength="2" placeholder="예: 07"><button id="addBtn">＋ 코드 생성</button></div>
   <div class="hint">01~99 숫자만 사용합니다. 제조사·모델·설비명·자산등록 정보는 이 기능에 없습니다.</div>
  </div>
 </div></div>`;
 document.getElementById('cmx').onclick=closeModal;
 document.getElementById('codeModal').onclick=e=>{if(e.target.id==='codeModal')closeModal()};
 document.getElementById('addBtn').onclick=()=>{
   const raw=document.getElementById('newNum').value.trim();
   if(!/^\\d{1,2}$/.test(raw)){alert('01~99 숫자만 입력하세요.');return}
   const n=Number(raw);if(n<1||n>99){alert('01~99만 가능합니다.');return}
   addCode(selected,n);openCodeModal();
 };
 renderModalCodes(c);
}
function renderModalCodes(c){
 const arr=codesFor(c.id), box=document.getElementById('modalCodes');
 box.innerHTML=arr.length?arr.map(n=>`<div class="codeRow"><span class="code">${fmt(c.prefix,n)}</span><button class="del" data-n="${n}">삭제</button></div>`).join(''):'<div class="empty">등록된 코드가 없습니다.</div>';
 box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{deleteCode(c.id,Number(b.dataset.n));renderModalCodes(c)});
}

function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function icons(){return load(ICON_KEY,[])}
function saveIcons(a){save(ICON_KEY,a)}
function renderIcons(){
 const wrap=document.getElementById('icons'), a=icons();
 wrap.innerHTML='';
 a.forEach((x,i)=>{
   const el=document.createElement('div');el.className='mapIcon';el.dataset.i=i;
   el.style.left=x.left+'%';el.style.top=x.top+'%';
   el.innerHTML='<div class="code">'+x.code+'</div><div class="type">'+x.name+'</div>';
   makeDraggable(el,i);wrap.appendChild(el);
 });
}
function makeDraggable(el,index){
 let dragging=false,sx=0,sy=0,sl=0,st=0;
 el.addEventListener('pointerdown',e=>{
   dragging=true;el.classList.add('dragging');el.setPointerCapture(e.pointerId);
   sx=e.clientX;sy=e.clientY;sl=parseFloat(el.style.left)||0;st=parseFloat(el.style.top)||0;e.preventDefault();
 });
 el.addEventListener('pointermove',e=>{
   if(!dragging)return;
   const r=document.getElementById('mapWrap').getBoundingClientRect();
   const nx=Math.max(0,Math.min(96,sl+(e.clientX-sx)/r.width*100));
   const ny=Math.max(0,Math.min(94,st+(e.clientY-sy)/r.height*100));
   el.style.left=nx+'%';el.style.top=ny+'%';
 });
 el.addEventListener('pointerup',()=>{
   if(!dragging)return;dragging=false;el.classList.remove('dragging');
   const a=icons();a[index].left=parseFloat(el.style.left);a[index].top=parseFloat(el.style.top);saveIcons(a);
 });
}

function openIconDelete(){
 const a=icons();
 document.getElementById('modalRoot').innerHTML=`
 <div class="modalBack" id="iconModal"><div class="modal">
  <div class="modalHead"><strong>아이콘 삭제</strong><button class="close" id="imx">×</button></div>
  <div class="modalBody" id="iconDeleteList"></div>
 </div></div>`;
 document.getElementById('imx').onclick=closeModal;
 document.getElementById('iconModal').onclick=e=>{if(e.target.id==='iconModal')closeModal()};
 renderIconDeleteList();
}
function renderIconDeleteList(){
 const box=document.getElementById('iconDeleteList');if(!box)return;
 const a=icons();
 box.innerHTML=a.length?a.map((x,i)=>`<div class="codeRow"><span><b class="code">${x.code}</b><br><small style="color:#71899b">${x.name}</small></span><button class="del" data-i="${i}">삭제</button></div>`).join(''):'<div class="empty">등록된 아이콘이 없습니다.</div>';
 box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
   const i=Number(b.dataset.i), a=icons();
   if(!confirm(a[i].code+' 아이콘만 삭제할까요?'))return;
   a.splice(i,1);saveIcons(a);renderIcons();renderIconDeleteList();
 });
}

// 아이콘을 실제로 추가하는 유일한 경로.
// 코드 생성과 완전히 분리되어 있으며, 원하는 코드와 이름을 직접 입력한다.
function addIcon(){
 const a=icons();
 const code=prompt('아이콘에 표시할 코드를 입력하세요.\\n예: AC-01');
 if(code===null)return;
 const c=code.trim().toUpperCase();
 if(!/^(AC|FI|BO|EL|LT|WP|SA|DR|OT)-\\d{2}$/.test(c)){alert('코드 형식은 AC-01처럼 입력하세요.');return}
 if(a.some(x=>x.code===c)){alert('이미 등록된 아이콘입니다.');return}
 const name=prompt('아이콘 이름을 입력하세요.\\n예: 실내기');
 if(name===null)return;
 a.push({code:c,name:name.trim()||'설비',left:10+(a.length%5)*16,top:10+Math.floor(a.length/5)*12});
 saveIcons(a);renderIcons();
}

// 헤더에서만 접근하는 기능
document.getElementById('codeOpen').onclick=openCodeModal;
document.getElementById('iconDeleteOpen').onclick=openIconDelete;

// 아이콘 등록은 화면 우측 하단의 보조 버튼으로 제공.
// 코드 생성과 자동 연동하지 않는다.
const add=document.createElement('button');
add.className='btn dark';add.textContent='＋ 아이콘 등록';add.style.position='fixed';add.style.right='24px';add.style.bottom='22px';add.style.zIndex='50';add.onclick=addIcon;
document.body.appendChild(add);

renderCats();renderCodes();renderIcons();
})();
</script>
</body>
</html>
