 <div class="panel missed"><h2 class="red">미조치 상세 현황 (${s.pending.length}건)</h2>${s.pending.slice(0,6).map(x=>`<div class="miss"><b>${x.handlerName||"담당 미지정"}</b>${x.category} · ${x.place} · ${x.content}<br>접수 ${time(x.createdAt)} · <span class="red">미조치</span></div>`).join("")||"<div class='small'>현재 미조치 사항이 없습니다.</div>"}</div></div>

function yearRows(s){return `<div class="compareline">2025년 접수 <b>0건</b></div><div class="compareline">2026년 접수 <b>${s.is.length}건</b></div><div class="compareline">2025년 조치완료 <b>0건</b></div><div class="compareline">2026년 조치완료 <b>${s.done.length}건</b></div><div class="compareline">2026년 미조치 <b>${s.pending.length}건</b></div>`}

function registerPage(){return `<div class="pagebar"><h1>시설·환경·안전 접수</h1><button class="btn gray" onclick="go('dashboard')">종합 대시보드</button></div><div class="notice">등록자 이름은 저장하지 않습니다. 접수시간은 자동 기록됩니다.</div><div class="panel"><div class="formgrid"><div class="field"><label>구분</label><select id="cat"><option>시설</option><option>환경</option><option>안전</option><option>기타</option></select></div><div class="field"><label>접수 장소</label><select id="place"><option value="">장소를 선택하세요</option>${PLACE_OPTIONS.map(p=>`<option value="${p}">${p}</option>`).join("")}</select></div><div class="field full"><label>접수사항</label><textarea id="content" rows="3" placeholder="문제 내용을 입력하세요"></textarea></div><div class="field full"><label>사진(선택)</label><input id="photo" type="file" accept="image/*"></div></div><button class="btn" style="margin-top:10px" onclick="addIssue()">접수 등록</button></div><div class="panel" style="margin-top:10px"><h2>최근 접수</h2>${db.issues.slice(-8).reverse().map(x=>`<div class="issue"><div><b>${x.category} · ${x.place}</b><br>${x.content}<div class="small">접수 ${time(x.createdAt)}</div></div><div class="status ${x.status==="완료"?"green":"red"}">${x.status}</div></div>`).join("")||"<div class='small'>접수된 사항이 없습니다.</div>"}</div>`}
function processPage(){const pending=db.issues.filter(x=>x.status!=="완료");return `<div class="pagebar"><div><h1>접수사항 실시간 조치</h1><div class="small">접수 → 실제 근무자 선택 → 조치완료 · 실시간 동기화</div></div><button class="btn gray" onclick="syncFromSupabase()">새로고침</button></div><div class="panel">${pending.map(x=>`<div class="issue"><div><b>${x.category} · ${x.place}</b><br>${x.content}<div class="small">접수시간 ${time(x.createdAt)} ${x.startedAt?`· 조치 시작 ${time(x.startedAt)}`:""} ${x.handlerName?`· 담당 ${x.handlerName}`:"· 담당 미지정"}</div>${x.photo_url?`<div style="margin-top:7px"><a href="${x.photo_url}" target="_blank">사진 보기</a></div>`:""}${x.handlerId?`<div style="margin-top:8px"><button class="btn green" onclick="completeIssue('${x.id}')">✓ 조치완료</button></div>`:""}</div><div><select onchange="assign('${x.id}',this.value)"><option value="">실제 근무자 선택</option>${workers.map(w=>`<option value="${w.id}" ${x.handlerId===w.id?"selected":""}>${w.name}</option>`).join("")}</select></div></div>`).join("")||"<div class='small'>현재 미조치 사항이 없습니다.</div>"}</div>`}
function basicPage(){const tw=todayWorkers();return `<div class="pagebar"><h1>기본업무 관리 · ${selectedDate}</h1><input type="date" value="${selectedDate}" onchange="setDate(this.value)"></div><div class="notice">근무편성표에서 실제 근무한 직원에게만 10개 항목이 부여됩니다. 10개 전부 완료한 근무일은 <b>기본업무 1일 완료</b>입니다. 근무했는데 하나라도 빠지면 그 날은 <b>기본업무 미완료일 1일</b>로 집계됩니다. 휴무·연가·공가·대체휴무는 대상에서 제외합니다.</div><div class="workergrid">${tw.map(w=>{if(!w.working)return `<div class="workerbox"><h3>${w.name}</h3><span class="badge off">${w.status||"휴무"}</span></div>`;const d=tasksFor(w.id);return `<div class="workerbox" style="grid-column:span 2"><h3>${w.name} · ${w.shift} ${w.start}~${w.end}</h3><div class="taskgrid">${tasks.map(t=>`<div class="task ${d.done.includes(t)?"done":""}"><span>${t}</span><button class="btn ${d.done.includes(t)?"gray":"green"}" onclick="toggleTask('${w.id}','${t}')">${d.done.includes(t)?"✓ 실시":"실시"}</button></div>`).join("")}</div><div class="small">현재 ${d.done.length}/10 · ${d.done.length===10?"오늘 기본업무 완료일":"미완료"}</div></div>`}).join("")}</div>`}
function statsPage(){const s=stats();const ym=monthKey();const today=todayWorkers();return `<div class="pagebar"><div><h1>직원별 근무 실적 한눈에</h1><div class="small">${ym} · 근무편성표 기준으로 자동 집계</div></div><input type="date" value="${selectedDate}" onchange="setDate(this.value)"></div><div class="empdash"><div class="empdash-head"><div><div class="empdash-title">이번 달 직원별 이행 현황</div><div class="empdash-sub">근무일 · 기본업무 · 접수사항을 한 화면에서 확인</div></div><div class="empdash-sub">실시간 반영 ON</div></div><div class="emp-kpis"><div class="emp-kpi"><span>전체 근무일</span><b>${s.targetDays}일</b></div><div class="emp-kpi"><span>기본업무 완료일</span><b>${s.completedDays}일</b></div><div class="emp-kpi"><span>기본업무 미완료일</span><b>${s.missDays}일</b></div><div class="emp-kpi"><span>조치완료</span><b>${s.done.length}건</b></div><div class="emp-kpi"><span>미조치</span><b>${s.pending.length}건</b></div></div><div class="emp-list">${workers.map(w=>{const bs=basicWorkerStats(w.id,ym);const mine=s.is.filter(x=>x.handlerId===w.id);const done=mine.filter(x=>x.status==="완료").length;const pending=mine.length-done;const pct=bs.target?Math.round(bs.complete/bs.target*100):0;const tw=today.find(x=>x.id===w.id);const alert=(bs.miss>0||pending>0);return `<div class="emp-row ${alert?'emp-alert':''}"><div class="emp-top"><div><div class="emp-name">${w.name}</div><div class="emp-shift">${w.shift}${w.start?` · ${w.start}~${w.end}`:''}</div></div><span class="emp-state ${tw&&!tw.working?'off':''}">${tw&&tw.working?'오늘 근무':'오늘 '+(tw?.status||'편성없음')}</span></div><div class="emp-line"><div class="emp-label">기본업무</div><div class="emp-track"><div class="emp-fill ${bs.miss?'bad':''}" style="width:${pct}%"></div></div><div class="emp-num">${bs.complete}/${bs.target}일</div></div><div class="emp-request"><div class="emp-chip"><small>접수사항 합계</small><b>${mine.length}건</b></div><div class="emp-chip"><small>완료</small><b>${done}건</b></div><div class="emp-chip red"><small>미완료</small><b>${pending}건</b></div></div><div class="emp-note">${bs.target?`기본업무 미완료 ${bs.miss}일`:'이번 달 근무일 없음'}${pending?` · 미조치 ${pending}건`:''}</div></div>`}).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn gray" onclick="showMonthYearCompare('month')">📈 월별 비교</button><button class="btn gray" onclick="showMonthYearCompare('year')">📊 연도별 비교</button></div><div class="emp-foot">※ 기본업무는 근무편성표의 실제 근무일만 대상이며, 하루 10개 항목을 모두 완료해야 완료일 1일로 집계합니다. 접수사항은 접수 1건마다 1건으로 집계합니다.</div></div>`}
function workerPage(){return `<div class="pagebar"><h1>근무자별 현황 · ${selectedDate}</h1></div><div class="workergrid">${todayWorkers().map(w=>{const d=tasksFor(w.id), bs=basicWorkerStats(w.id,monthKey()), mine=db.issues.filter(x=>x.handlerId===w.id&&x.createdAt.slice(0,7)===monthKey()),p=mine.filter(x=>x.status!=="완료");return `<div class="workerbox"><h3>${w.name}</h3><span class="badge ${w.working?"":"off"}">${w.working?w.shift+" "+w.start+"~"+w.end:w.status}</span><div class="compareline">기본업무 <b>${w.working?`${bs.complete}/${bs.target}일`:"-"}</b></div><div class="compareline">조치완료 <b>${w.working?mine.filter(x=>x.status==="완료").length:"-"}</b></div><div class="compareline">미조치 <b class="${p.length?"red":"green"}">${w.working?p.length:"-"}</b></div><div class="compareline">접수 합계 <b>${mine.length}건</b></div></div>`}).join("")}</div>`}
function pendingPage(){const p=db.issues.filter(x=>x.status!=="완료");return `<div class="pagebar"><h1>미조치 현황</h1></div><div class="panel">${p.map(x=>`<div class="issue"><div><b class="red">${x.handlerName||"담당 미지정"}</b><br>${x.category} · ${x.place} · ${x.content}<div class="small">접수시간 ${time(x.createdAt)}</div></div><button class="btn" onclick="go('process')">조치</button></div>`).join("")||"<div class='small'>미조치 사항이 없습니다.</div>"}</div>`}
function settingsPage(){return `<div class="pagebar"><h1>시스템 설정</h1></div><div class="panel"><h2>근무시간 기준</h2><div class="compareline">새벽조 <b>06:00~15:00 · 9시간</b></div><div class="compareline">오전조 <b>09:00~18:00 · 9시간</b></div><div class="compareline">오후조 <b>13:30~22:30 · 9시간</b></div><hr><button class="btn red" onclick="resetAll()">테스트 데이터 전체 초기화</button></div>`}
async function ensureMainEquipmentAssets(){try{const rows=JGB_MAIN_EQUIPMENT.map(e=>({asset_code:e.code,name:e.name,category:e.type,place:e.place,status:"정상",product_name:e.type}));const r=await SUPA.from("assets").upsert(rows,{onConflict:"asset_code",ignoreDuplicates:true});if(r.error)console.warn("주요설비 자산 등록",r.error)}catch(e){console.warn(e)}}

function eamPage(){
 const A=window.__eamA||[],H=window.__eamH||[],I=window.__eamI||[];
 const excel=(Array.isArray(JGB_EXCEL_EQUIPMENT)?JGB_EXCEL_EQUIPMENT:[]).filter((e,i,a)=>a.findIndex(z=>z.code===e.code)===i);
 const main=(Array.isArray(JGB_MAIN_EQUIPMENT)?JGB_MAIN_EQUIPMENT:[]).filter(e=>e.code!=='EQ-06');
 const leaks=[['A-001','A구간 · 1번 코트 인접 벽체 누수'],['B-001','B구간 · 5번 코트 인접 벽체 누수(좌측)'],['C-001','C구간 · 2·3번 코트 외부 천장 누수'],['D-001','D구간 · 5번 코트 인접 벽체 누수(우측)'],['E-001','E구간 · 여자 탈의실 천장 누수']];
 // 사용자 지정 분류: 스마트온수기는 온수, EQ-06은 제외, 명확한 중복 분전반/예비펌프는 1건으로 표시
 const cooling=excel.filter(e=>e.type==='냉난방');
 const water=[main.find(e=>e.code==='EQ-04'),excel.find(e=>e.code==='BO-02'),excel.find(e=>e.code==='BO-03')].filter(Boolean).map(e=>({...e, type:'온수·난방'}));
 const fireMain=main.filter(e=>['EQ-01','EQ-02','EQ-03','EQ-05','EQ-07'].includes(e.code));
 const fireExcel=excel.filter(e=>e.type==='소방').filter(e=>!['FI-03','FI-08'].includes(e.code));
 const fire=[...fireMain,...fireExcel];
 const heating=excel.filter(e=>e.code==='FI-05').map(e=>({...e,type:'온수·난방',name:'난방순환펌프'}));
 const other=excel.filter(e=>e.type==='기타');
 const electrical=excel.filter(e=>e.type==='전기');

async function saveMaintenance(){
  const name=document.getElementById('maintName')?.value.trim();

  const date=document.getElementById('maintDate')?.value;
  const vendor=document.getElementById('maintVendor')?.value.trim();

  const cost=Number(document.getElementById('maintCost')?.value||0);
  if(!name||!place||!desc){alert('시설·설비명, 위치, 수리 내역을 입력하세요.');return}
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const catMap={cooling:'냉난방',fire:'소방설비',water:'보일러·온수',electrical:'전기설비',lighting:'코트조명',waterproof:'방수',other:'기타설비',leak:'누수관리'};
  const category=catMap[window.__maintCat||'other']||'기타설비';
  let assetId=window.__maintAssetId||null;

    const code='MT-'+Date.now();

async function completeIssue(id){
 const x=db.issues.find(i=>i.id===id);
 if(!x||!x.handlerId){alert("먼저 실제 조치 직원을 선택하세요.");return}
 const now=new Date().toISOString();
 const elapsed=Math.max(0,Math.round((new Date(now)-new Date(x.createdAt))/60000));
 if(x.remoteId){
   const r=await SUPA.from("requests").update({status:"완료",handler_name:x.handlerName,started_at:x.startedAt||now,completed_at:now,elapsed_minutes:elapsed}).eq("id",x.remoteId);
   if(r.error){alert("조치완료 저장에 실패했습니다.");return}
 }
 /* 완료 순간에만 EAM에 자동 누적: 별도 유지보수 이력 메뉴를 만들지 않는다. */
 try{
   if(SUPA){
     const assetCategory="기타설비";
     let asset=null;
     const aq=await SUPA.from("assets").select("id,name,category,place").eq("place",x.place).limit(20);
     if(!aq.error && aq.data?.length) asset=aq.data.find(a=>String(a.name||"").trim()===String(x.content||"").trim())||aq.data[0];
     if(!asset){
       const ar=await SUPA.from("assets").insert({asset_code:"REQ-"+Date.now(),name:x.content||"시설관리 작업",category:assetCategory,place:x.place||"-",status:"정상",product_name:assetCategory}).select("id,name,category,place").single();
       if(ar.error) throw ar.error;
       asset=ar.data;
     }
     const hr=await SUPA.from("asset_history").insert({asset_id:asset.id,event_type:"작업완료",description:x.content||"시설관리 작업 완료",worker_name:x.handlerName||"",action_type:"직원작업",cost:0,event_date:now.slice(0,10)});
     if(hr.error) throw hr.error;
   }
 }catch(e){console.error("EAM 자동등록 실패",e);alert("조치완료는 저장됐지만 EAM 자동등록에 실패했습니다. 관리자에게 확인해 주세요.");return}
 await syncFromSupabase();
 if(typeof eamLoad==="function") await eamLoad();
 render();
}

    window.__eamClickBound=true;

<script id="REQUEST_RATE_RULE">
(function(){
  window.calcRequestRate = function(receivedCount, completedCount){
    receivedCount = Number(receivedCount)||0;
    completedCount = Number(completedCount)||0;
    if(receivedCount===0) return 0;
    return Math.round((completedCount/receivedCount)*100);
  };
})();
</script>

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function renderMonthYearCompare(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>
          <div class="myc-card">완료율<b class="v">${rate}%</b><div class="s">완료 건수 ÷ 접수 건수</div></div>
        </div>
        <table class="myc-table"><thead><tr><th>월</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전월 대비 접수</th></tr></thead>
        <tbody>${months.map(x=>{const r=x.z.received?Math.round(x.z.done/x.z.received*100):0; return `<tr><td><b>${x.m}월</b></td><td>${x.z.received}건</td><td class="myc-up">${x.z.done}건</td><td class="${x.z.miss?'myc-down':'myc-zero'}">${x.z.miss}건</td><td>${r}%</td><td class="${x.delta>0?'myc-up':x.delta<0?'myc-down':'myc-zero'}">${x.delta>0?"+":""}${x.delta}건</td></tr>`}).join("")}</tbody></table>`;
    }else{
      const years=[2025,2026];
      box.innerHTML=`
        <div class="myc-grid">
          ${years.map(y=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}if(y===2025&&!rec)rec=0;const rate=rec?Math.round(done/rec*100):0;return `<div class="myc-card"><b>${y}년</b><div class="v">${rec}건</div><div class="s">접수 · 완료 ${done}건 · 미완료 ${miss}건 · 완료율 ${rate}%</div></div>`}).join("")}
        </div>
        <table class="myc-table"><thead><tr><th>연도</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전년도 대비 접수</th></tr></thead>
        <tbody>${years.map((y,i)=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}const prev=i?((()=>{const q=d[years[i-1]]||{};let n=0;for(const m in q)n+=q[m].received;return n})()):0;const rate=rec?Math.round(done/rec*100):0;const delta=rec-prev;return `<tr><td><b>${y}년</b></td><td>${rec}건</td><td class="myc-up">${done}건</td><td class="${miss?'myc-down':'myc-zero'}">${miss}건</td><td>${rate}%</td><td class="${delta>0?'myc-up':delta<0?'myc-down':'myc-zero'}">${delta>0?"+":""}${delta}건</td></tr>`}).join("")}</tbody></table>`;
    }
  }
  window.showMonthYearCompare=function(mode){
    const sec=document.getElementById("monthYearCompare");
    if(!sec)return;
    sec.style.display="block";
    document.querySelectorAll("#monthYearCompare .myc-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    renderMonthYearCompare(mode);
    sec.scrollIntoView({behavior:"smooth",block:"start"});
  };
})();
</script>

<section id="monthYearCompare" style="display:none" class="myc-wrap">
  <div class="myc-head">
    <div><h2 style="margin:0">📈 월별 · 연도별 개선 현황</h2><div style="font-size:12px;color:#64748b;margin-top:4px">접수 건수를 기준으로 이전 기간과 비교</div></div>
    <div class="myc-tabs">
      <button data-mode="month" onclick="showMonthYearCompare('month')">월별 비교</button>
      <button data-mode="year" onclick="showMonthYearCompare('year')">연도별 비교</button>
    </div>
  </div>
  <div id="monthYearCompareBody"></div>
</section>
</body></html>
