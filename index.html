  const m=date.slice(0,7), day=Number(date.slice(8,10));

  let n=0; const y=Number(month.slice(0,4)), m=Number(month.slice(5,7));

}

eld" style="margin-top:8px"><label>내용</label><textarea id="histDesc" rows="3"></textarea></div><div class="field" style="margin-top:8px"><label>담당자/업체</label><input id="histWorker" placeholder="직원명 또는 업체명"></div><div class="field" style="margin-top:8px"><label>조치 구분</label><select id="histAction"><option>직원 조치</option><option>외부 수리</option><option>외부 교체</option><option>외부 점검</option></select></div><div class="field" style="margin-top:8px"><label>비용</label><input id="histCost" type="number" value="0"></div><button class="btn" style="margin-top:8px" onclick="addAssetHistory('${a.id}')">이력 저장</button></div><div class="panel"><h2>점검 이력 등록</h2><div class="field"><label>결과</label><select id="inspResult"><option>정상</option><option>주의</option><option>조치필요</option></select></div><div class="field" style="margin-top:8px"><label>점검자</label><select id="inspWorker">${workers.map(w=>`<option>${w.name}</option>`).join("")}</select></div><div class="field" style="margin-top:8px"><label>메모</label><textarea id="inspMemo" rows="3"></textarea></div><button class="btn green" style="margin-top:8px" onclick="addInspection('${a.id}')">점검 기록</button></div><div class="panel"><h2>시설물 요약</h2><div class="compareline">고장·수리 이력 <b>${H.filter(v=>v.asset_id===a.id).length}건</b></div><div class="compareline">점검 이력 <b>${I.filter(v=>v.asset_id===a.id).length}건</b></div><div class="compareline">최근 이력 <b>${H.filter(v=>v.asset_id===a.id)[0]?time(H.filter(v=>v.asset_id===a.id)[0].event_date):'-'}</b></div></div></div>`:''}`}
function leakagePage(){
 const A=window.__eamA||[],H=window.__eamH||[], codes=['A-001','B-001','C-001','D-001','E-001'];
 const leaks=codes.map(c=>A.find(v=>v.asset_code===c)).filter(Boolean);
 const allH=H.filter(v=>leaks.some(a=>a.id===v.asset_id));
 const open=leaks.filter(a=>a.status!=='정상').length;
 const repairs=allH.filter(v=>['수리','교체','수리완료','교체완료'].includes(v.event_type)).length;
 const latest=allH[0];
 return `<div class="pagebar"><div><h1>💧 누수 통합관리</h1><div class="small">장군봉체육관 A~E 누수 구간 · 접수 → 현장확인 → 조치 → 수리·교체 → 이력관리</div></div><button class="btn gray" onclick="eamLoad().then(render)">실시간 새로고침</button></div>
 <div class="emp-kpis" style="grid-template-columns:repeat(5,1fr)">
  <div class="emp-kpi"><span>누수 관리구간</span><b>${leaks.length}개</b></div>
  <div class="emp-kpi"><span>현재 조치필요</span><b>${open}개</b></div>
  <div class="emp-kpi"><span>누수 이력</span><b>${allH.length}건</b></div>
  <div class="emp-kpi"><span>수리·교체</span><b>${repairs}건</b></div>
  <div class="emp-kpi"><span>최근 이력</span><b>${latest?time(latest.event_date):'-'}</b></div>
 </div>
 <div class="panel" style="margin-top:12px"><h2>장군봉체육관 누수 구간 한눈에</h2><div class="small" style="margin-bottom:12px">실제 누수도 기준 A~E 구간을 시설물 자산으로 분리해 관리합니다.</div>
 <div class="grid3">${leaks.map(a=>{const hs=H.filter(v=>v.asset_id===a.id);const last=hs[0];const need=hs.find(v=>v.event_type==='고장'||v.event_type==='누수접수');return `<div class="issue" style="border-left:5px solid ${a.status==='정상'?'#22c55e':'#ef4444'};padding:16px;cursor:pointer" onclick="window.__eamSel='${a.id}';go('eam')"><div style="display:flex;justify-content:space-between;gap:8px"><b>${xEsc(a.asset_code)} · ${xEsc(a.name)}</b><span class="badge ${a.status==='정상'?'':'off'}">${xEsc(a.status)}</span></div><div class="small" style="margin-top:6px">${xEsc(a.place)}</div><div class="compareline">누수 이력 <b>${hs.length}건</b></div><div class="compareline">최근 이력 <b>${last?time(last.event_date):'-'}</b></div><div class="compareline">최근 조치 <b>${last?xEsc(last.event_type):'없음'}</b></div></div>`}).join('')}</div></div>
 <div class="grid3" style="margin-top:12px"><div class="panel" style="grid-column:span 2"><h2>누수 이력 전체</h2>${allH.length?allH.map(v=>{const a=leaks.find(z=>z.id===v.asset_id);return `<div class="issue"><div><b>${a?xEsc(a.asset_code+' · '+a.name):'-'}</b><div>${xEsc(v.event_type)} · ${xEsc(v.description||'-')}</div><div class="small">${time(v.event_date)} · ${xEsc(v.worker_name||v.vendor_name||'')}</div></div><span class="badge">${v.action_type?xEsc(v.action_type):'내부/외부 미기록'}</span></div>`}).join(''):'<div class="small">등록된 누수 이력이 없습니다.</div>'}</div>
 <div class="panel"><h2>누수 관리 원칙</h2><div class="notice">A 1번 코트 인접 벽체<br>B 5번 코트 인접 벽체(좌측)<br>C 2·3번 코트 외부 천장<br>D 5번 코트 인접 벽체(우측)<br>E 여자 탈의실 천장</div><div class="small" style="margin-top:10px">직원 조치와 외부 수리·교체는 별도로 기록합니다.</div></div></div>`
}
async function addAssetHistory(assetId){const description=document.getElementById("histDesc").value.trim();if(!description){alert("내용을 입력하세요.");return}const r=await SUPA.from("asset_history").insert({asset_id:assetId,event_type:document.getElementById("histType").value,description,worker_name:document.getElementById("histWorker").value.trim(),action_type:document.getElementById("histAction")?.value||'직원 조치',cost:Number(document.getElementById("histCost").value||0)});if(r.error){alert("이력 저장에 실패했습니다.");return}await eamLoad();render()}
async function addInspection(assetId){const r=await SUPA.from("inspections").insert({asset_id:assetId,result:document.getElementById("inspResult").value,inspector_name:document.getElementById("inspWorker").value,memo:document.getElementById("inspMemo").value.trim()});if(r.error){alert("점검 저장에 실패했습니다.");return}await eamLoad();render()}

function xEsc(s){return String(s??'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
async function addIssue(){const c=document.getElementById("content").value.trim(),p=document.getElementById("place").value,cat=document.getElementById("cat").value;if(!c||!p){alert("접수 장소와 접수사항을 입력하세요.");return}const btn=document.getElementById("intakeBtn");if(btn)btn.disabled=true;let photo_url="";try{const f=document.getElementById("photo")?.files?.[0];if(f){const path=`${Date.now()}_${f.name.replace(/[^\w가-힣.\-]/g,"_")}`;const up=await SUPA.storage.from("request-photos").upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+"/storage/v1/object/public/request-photos/"+path;}const now=new Date().toISOString();const ins=await SUPA.from("requests").insert({category:cat,place:p,content:c,photo_url,status:"접수",received_at:now});if(ins.error)throw ins.error;alert("접수가 완료되었습니다.");document.getElementById("content").value="";if(document.getElementById("photo"))document.getElementById("photo").value="";await syncFromSupabase();go("process")}catch(e){console.error(e);alert("접수에 실패했습니다. Supabase 연결을 확인하세요.")}finally{if(btn)btn.disabled=false}}
async function assign(id,wid){const x=db.issues.find(i=>i.id===id);if(!x||!wid)return;const w=workers.find(v=>v.id===wid);if(!w)return;const started=x.startedAt||new Date().toISOString();if(x.remoteId){const r=await SUPA.from("requests").update({handler_name:w.name,status:"조치중",started_at:started}).eq("id",x.remoteId);if(r.error){alert("담당 직원 저장에 실패했습니다.");return}}await syncFromSupabase()}
async function completeIssue(id){const x=db.issues.find(i=>i.id===id);if(!x||!x.handlerId){alert("먼저 실제 조치 직원을 선택하세요.");return}const now=new Date().toISOString();const elapsed=Math.max(0,Math.round((new Date(now)-new Date(x.createdAt))/60000));if(x.remoteId){const r=await SUPA.from("requests").update({status:"완료",handler_name:x.handlerName,started_at:x.startedAt||now,completed_at:now,elapsed_minutes:elapsed}).eq("id",x.remoteId);if(r.error){alert("조치완료 저장에 실패했습니다.");return}}await syncFromSupabase()}function toggleTask(wid,t){const d=tasksFor(wid);d.done=d.done.includes(t)?d.done.filter(x=>x!==t):[...d.done,t];d.updatedAt=new Date().toISOString();save();render()}
function setDate(v){if(v){selectedDate=v;render()}}
function time(v){return new Date(v).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}
function seedDemo(){if(db.issues.length)return alert("이미 테스트 데이터가 있습니다.");let now=Date.now();db.issues=[{id:"I"+now,category:"시설",place:"2층 남자화장실",content:"조명 점검 필요",status:"미조치",createdAt:new Date(now-35*60000).toISOString(),handlerId:"w1",handlerName:"김민수",completedAt:""},{id:"I"+(now+1),category:"환경",place:"복도",content:"바닥 청소 요청",status:"완료",createdAt:new Date(now-70*60000).toISOString(),handlerId:"w2",handlerName:"이현우",completedAt:new Date(now-25*60000).toISOString()}];save();render()}
function resetAll(){if(confirm("테스트 데이터를 모두 삭제할까요?")){db={issues:[],tasks:{},schedule:{}};save();render()}}
eamLoad().then(function(){externalLoad().then(render)});
syncFromSupabase();
startRealtime();
setInterval(syncFromSupabase,5000);
</script>

<script id="REQUEST_RATE_RULE">
(function(){
  window.calcRequestRate = function(receivedCount, completedCount){
    receivedCount = Number(receivedCount)||0;
    completedCount = Number(completedCount)||0;
    if(receivedCount===0) return 0;
    return Math.round((completedCount/receivedCount)*100);
  };
})();
</script>

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function render(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>
          <div class="myc-card">완료율<b class="v">${rate}%</b><div class="s">완료 건수 ÷ 접수 건수</div></div>
        </div>
        <table class="myc-table"><thead><tr><th>월</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전월 대비 접수</th></tr></thead>
        <tbody>${months.map(x=>{const r=x.z.received?Math.round(x.z.done/x.z.received*100):0; return `<tr><td><b>${x.m}월</b></td><td>${x.z.received}건</td><td class="myc-up">${x.z.done}건</td><td class="${x.z.miss?'myc-down':'myc-zero'}">${x.z.miss}건</td><td>${r}%</td><td class="${x.delta>0?'myc-up':x.delta<0?'myc-down':'myc-zero'}">${x.delta>0?"+":""}${x.delta}건</td></tr>`}).join("")}</tbody></table>`;
    }else{
      const years=[2025,2026];
      box.innerHTML=`
        <div class="myc-grid">
          ${years.map(y=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}if(y===2025&&!rec)rec=0;const rate=rec?Math.round(done/rec*100):0;return `<div class="myc-card"><b>${y}년</b><div class="v">${rec}건</div><div class="s">접수 · 완료 ${done}건 · 미완료 ${miss}건 · 완료율 ${rate}%</div></div>`}).join("")}
        </div>
        <table class="myc-table"><thead><tr><th>연도</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전년도 대비 접수</th></tr></thead>
        <tbody>${years.map((y,i)=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}const prev=i?((()=>{const q=d[years[i-1]]||{};let n=0;for(const m in q)n+=q[m].received;return n})()):0;const rate=rec?Math.round(done/rec*100):0;const delta=rec-prev;return `<tr><td><b>${y}년</b></td><td>${rec}건</td><td class="myc-up">${done}건</td><td class="${miss?'myc-down':'myc-zero'}">${miss}건</td><td>${rate}%</td><td class="${delta>0?'myc-up':delta<0?'myc-down':'myc-zero'}">${delta>0?"+":""}${delta}건</td></tr>`}).join("")}</tbody></table>`;
    }
  }
  window.showMonthYearCompare=function(mode){
    const sec=document.getElementById("monthYearCompare");
    if(!sec)return;
    sec.style.display="block";
    document.querySelectorAll("#monthYearCompare .myc-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    render(mode);
    sec.scrollIntoView({behavior:"smooth",block:"start"});
  };
})();
</script>

<section id="monthYearCompare" style="display:none" class="myc-wrap">
  <div class="myc-head">
    <div><h2 style="margin:0">📈 월별 · 연도별 개선 현황</h2><div style="font-size:12px;color:#64748b;margin-top:4px">접수 건수를 기준으로 이전 기간과 비교</div></div>
    <div class="myc-tabs">
      <button data-mode="month" onclick="showMonthYearCompare('month')">월별 비교</button>
      <button data-mode="year" onclick="showMonthYearCompare('year')">연도별 비교</button>
    </div>
  </div>
  <div id="monthYearCompareBody"></div>
</section>
