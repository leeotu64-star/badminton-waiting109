      <header><div><strong>${w.name}</strong><small>${w.status||w.shift} · ${w.start}~${w.end}</small></div><em class="${isHoliday?'auto':''}">${isHoliday?'자동완료 · 1건':'직접 실시 · '+n+'/10'}</em></header>
      <div class="worker-bar"><i style="width:${isHoliday?100:n*10}%"></i></div>
      <div class="task-v2-grid">${tasks.map((t,i)=>{const done=d.done.includes(t);return `<button class="task-v2 ${done?'done':''}" ${isHoliday?'disabled':''} onclick="toggleTask('${w.id}','${t.replace(/'/g,"\\'")}')"><span>${String(i+1).padStart(2,'0')}</span><b>${t}</b><em>${done?'✓ 완료':'실시'}</em></button>`}).join('')}</div>
      <footer><span>${isHoliday?'휴일근무자는 기본업무 1건으로 자동 집계':'10개 업무 중 '+n+'개 완료'}</span><strong>${isHoliday?'100%':n*10+'%'}</strong></footer>
    </article>`;
   }).join('')}
  </div>
 </div>`;
}
