<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>장군봉체육관 직원 신고</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font-family:"Malgun Gothic",Arial,sans-serif}
button,input,select,textarea{font:inherit}
.page{width:min(620px,100%);margin:auto;padding:18px 14px 32px}
.top{background:linear-gradient(135deg,#082b52,#1769c1);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 12px 30px rgba(8,43,82,.18)}
.top .eyebrow{font-size:10px;letter-spacing:.12em;font-weight:900;opacity:.72}
.top h1{margin:7px 0 4px;font-size:27px}
.top p{margin:0;font-size:12px;opacity:.86}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.progress span{height:5px;border-radius:99px;background:rgba(255,255,255,.3)}
.progress span.on{background:#fff}
.card{background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(15,23,42,.06)}
.section{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid #edf1f5}
.section:last-of-type{border-bottom:0;margin-bottom:0}
.step{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.step-no{width:29px;height:29px;border-radius:9px;background:#eaf3ff;color:#1769c1;display:grid;place-items:center;font-size:12px;font-weight:900}
.step b{font-size:14px}.step small{display:block;color:#718096;font-size:10px;margin-top:2px}
.field{margin-top:10px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}
.req{color:#e11d48;font-size:10px;margin-left:3px}
.field select,.field input,.field textarea{width:100%;border:1px solid #ccd7e3;border-radius:11px;padding:12px;background:#fff;color:#172033;outline:none}
.field select:focus,.field input:focus,.field textarea:focus{border-color:#1769c1;box-shadow:0 0 0 3px rgba(23,105,193,.1)}
.field textarea{min-height:120px;resize:vertical}
.choice{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.choice button{border:1px solid #d6e0ea;background:#fff;border-radius:10px;padding:10px 5px;font-size:11px;font-weight:800;cursor:pointer}
.choice button.on{border-color:#1769c1;background:#edf5ff;color:#1769c1}
.photo{border:1px dashed #b8c7d7;background:#f8fafc;border-radius:12px;padding:13px}
.photo input{border:0;padding:0;background:transparent}
.submit{width:100%;height:54px;border:0;border-radius:13px;background:#1769c1;color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(23,105,193,.2)}
.submit:disabled{opacity:.55;cursor:default}
.ok{display:none;margin-bottom:12px;padding:15px;border-radius:13px;background:#ecfdf3;border:1px solid #a7e3bd;color:#08783c;font-weight:900}
.fail{display:none;margin-bottom:12px;padding:15px;border-radius:13px;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;font-weight:800}
.foot{text-align:center;color:#7b8794;font-size:10px;margin-top:11px;line-height:1.5}
@media(max-width:420px){.choice{grid-template-columns:repeat(2,1fr)}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="eyebrow">JANGGUNBONG GYMNASIUM · STAFF</div>
    <h1>시설 이상 신고</h1>
    <p>현장에서 발견한 문제를 바로 접수하세요.</p>
    <div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
  </div>

  <div id="ok" class="ok">✓ 신고가 접수되었습니다.<br><span style="font-weight:700;font-size:11px">관리자 작업관리에서 확인할 수 있습니다.</span></div>
  <div id="fail" class="fail"></div>

  <div class="card">
    <div class="section">
      <div class="step"><div class="step-no">01</div><div><b>신고자</b><small>신고하는 직원을 선택하세요.</small></div></div>
      <div class="field">
        <label>직원 <span class="req">필수</span></label>
        <select id="reporter">
          <option value="">직원을 선택하세요</option>
          <option value="김민수">김민수</option>
          <option value="이현우">이현우</option>
          <option value="박성훈">박성훈</option>
          <option value="최지훈">최지훈</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="step"><div class="step-no">02</div><div><b>신고 내용</b><small>문제의 종류와 발생 위치를 입력하세요.</small></div></div>
      <div class="field">
        <label>신고 분야 <span class="req">필수</span></label>
        <div class="choice" id="categories">
          <button type="button" data-v="시설" class="on">시설</button>
          <button type="button" data-v="전기">전기</button>
          <button type="button" data-v="소방">소방</button>
          <button type="button" data-v="안전">안전</button>
          <button type="button" data-v="냉난방">냉난방</button>
          <button type="button" data-v="누수">누수</button>
          <button type="button" data-v="환경">환경</button>
          <button type="button" data-v="기타">기타</button>
        </div>
      </div>
      <div class="field">
        <label>발생 위치 <span class="req">필수</span></label>
        <input id="place" placeholder="예: 2층 3번 코트 / 지하 기계실">
      </div>
      <div class="field">
        <label>이상 내용 <span class="req">필수</span></label>
        <textarea id="content" placeholder="발견한 문제를 구체적으로 입력하세요."></textarea>
      </div>
    </div>

    <div class="section">
      <div class="step"><div class="step-no">03</div><div><b>현장 사진</b><small>필요하면 현장에서 바로 촬영하세요.</small></div></div>
      <div class="photo"><input id="photo" type="file" accept="image/*" capture="environment"></div>
    </div>

    <button id="submit" class="submit" type="button">신고 접수</button>
    <div class="foot">접수된 신고는 관리자 작업관리로 전달됩니다.</div>
  </div>
</div>

<script>
const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFkhucxDzgst9JxJA_0FjvYKB9";
const SUPA=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let category="시설";

document.querySelectorAll("#categories button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    category=btn.dataset.v;
    document.querySelectorAll("#categories button").forEach(x=>x.classList.toggle("on",x===btn));
  });
});

async function submitReport(){
  const reporter=document.getElementById("reporter").value;
  const place=document.getElementById("place").value.trim();
  const content=document.getElementById("content").value.trim();
  const file=document.getElementById("photo").files[0];
  const btn=document.getElementById("submit");
  const ok=document.getElementById("ok"), fail=document.getElementById("fail");

  ok.style.display="none"; fail.style.display="none";
  if(!reporter){alert("직원을 선택하세요.");return}
  if(!place){alert("발생 위치를 입력하세요.");return}
  if(!content){alert("이상 내용을 입력하세요.");return}
  if(!SUPA){fail.textContent="Supabase 연결에 실패했습니다.";fail.style.display="block";return}

  btn.disabled=true; btn.textContent="접수 중...";
  try{
    let photo_url="";
    if(file){
      const safe=file.name.replace(/[^\w가-힣.\-]/g,"_");
      const path=Date.now()+"_"+safe;
      const up=await SUPA.storage.from("request-photos").upload(path,file,{upsert:false});
      if(up.error) throw up.error;
      photo_url=SUPABASE_URL+"/storage/v1/object/public/request-photos/"+path;
    }
    const tagged="[[신고자:"+reporter+"]] "+content;
    const r=await SUPA.from("requests").insert({
      category,place,content:tagged,photo_url,status:"접수",received_at:new Date().toISOString()
    });
    if(r.error) throw r.error;

    ok.style.display="block";
    document.getElementById("place").value="";
    document.getElementById("content").value="";
    document.getElementById("photo").value="";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    console.error(e);
    fail.textContent="신고 접수에 실패했습니다. "+(e?.message||"권한 또는 연결 상태를 확인하세요.");
    fail.style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  }finally{
    btn.disabled=false; btn.textContent="신고 접수";
  }
}
document.getElementById("submit").addEventListener("click",submitReport);
</script>
</body>
</html>
