 const months=[];
 for(let i=1;i<=m;i++){
   const key=`${y}-${pad(i)}`;
   const assets=A.filter(a=>String(a.created_at||a.createdAt||"").slice(0,7)===key).length;
   const hist=H.filter(h=>String(h.event_date||h.created_at||"").slice(0,7)===key);

   months.push({key,assets,hist:hist.length,consum:consum.length,retire:retire.length,cost});

  </div>`;

function statsPage(){const s=stats();const ym=monthKey();const today=todayWorkers();return `<div class="pagebar"><div><h1>직원별 근무 실적 한눈에</h1><div class="small">${ym} · 근무편성표 기준으로 자동 집계</div></div><input type="date" value="${selectedDate}" onchange="setDate(this.value)"></div><div class="empdash"><div class="empdash-head"><div><div class="empdash-title">이번 달 직원별 이행 현황</div><div class="empdash-sub">근무일 · 기본업무 · 접수사항을 한 화면에서 확인</div></div><div class="empdash-sub">실시간 반영 ON</div></div><div class="emp-kpis"><div class="emp-kpi"><span>전체 근무일</span><b>${s.targetDays}일</b></div><div class="emp-kpi"><span>기본업무 완료일</span><b>${s.completedDays}일</b></div><div class="emp-kpi"><span>기본업무 미완료일</span><b>${s.missDays}일</b></div><div class="emp-kpi"><span>조치완료</span><b>${s.done.length}건</b></div><div class="emp-kpi"><span>미조치</span><b>${s.pending.length}건</b></div></div><div class="emp-list">${workers.map(w=>{const bs=basicWorkerStats(w.id,ym);const mine=s.is.filter(x=>x.handlerId===w.id);const done=mine.filter(x=>x.status==="완료").length;const pending=mine.length-done;const pct=bs.target?Math.round(bs.complete/bs.target*100):0;const tw=today.find(x=>x.id===w.id);const alert=(bs.miss>0||pending>0);return `<div class="emp-row ${alert?'emp-alert':''}"><div class="emp-top"><div><div class="emp-name">${w.name}</div><div class="emp-shift">${w.shift}${w.start?` · ${w.start}~${w.end}`:''}</div></div><span class="emp-state ${tw&&!tw.working?'off':''}">${tw&&tw.working?'오늘 근무':'오늘 '+(tw?.status||'편성없음')}</span></div><div class="emp-line"><div class="emp-label">기본업무</div><div class="emp-track"><div class="emp-fill ${bs.miss?'bad':''}" style="width:${pct}%"></div></div><div class="emp-num">${bs.complete}/${bs.target}일</div></div><div class="emp-request"><div class="emp-chip"><small>접수사항 합계</small><b>${mine.length}건</b></div><div class="emp-chip"><small>완료</small><b>${done}건</b></div><div class="emp-chip red"><small>미완료</small><b>${pending}건</b></div></div><div class="emp-note">${bs.target?`기본업무 미 async function eamEditSelectedAsset(){
  const code=window.__eamSelCode||''; if(!code){alert('수정할 시설·설비를 선택하세요.');return}
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));
  if(!a){alert('등록된 EAM 자산을 찾을 수 없습니다.');return}
  const name=prompt('시설·설비명',a.name||''); if(name===null)return;
  const place=prompt('설치 위치',a.place||''); if(place===null)return;
  if(!String(name).trim()||!String(place).trim()){alert('시설·설비명과 위치를 입력하세요.');return}
  const r=await SUPA.from('assets').update({name:String(name).trim(),place:String(place).trim()}).eq('id',a.id);
  if(r.error){console.error(r.error);alert('자산 수정에 실패했습니다.');return}
  await eamLoad(); render();
}
async function eamDeleteSelectedAsset(){
  const code=window.__eamSelCode||''; if(!code){alert('삭제할 시설·설비를 선택하세요.');return}
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));
  if(!a){alert('등록된 EAM 자산을 찾을 수 없습니다.');return}
  if(!confirm(`'${a.name||code}' 시설·설비를 삭제할까요?\n연결된 작업 이력도 함께 삭제됩니다.`))return;
  const hr=await SUPA.from('asset_history').delete().eq('asset_id',a.id);
  if(hr.error){console.error(hr.error);alert('연결된 작업 이력 삭제에 실패했습니다.');return}
  const ir=await SUPA.from('inspections').delete().eq('asset_id',a.id);
  if(ir.error){console.error(ir.error);alert('연결된 점검 이력 삭제에 실패했습니다.');return}
  const ar=await SUPA.from('assets').delete().eq('id',a.id);
  if(ar.error){console.error(ar.error);alert('EAM 자산 삭제에 실패했습니다.');return}
  window.__eamSelCode=''; await eamLoad(); render();
}



async function eamRetireSelectedAsset(){
  const code=window.__eamSelCode||''; if(!code){alert('폐기할 시설·설비를 선택하세요.');return}
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));
  if(!a){alert('등록된 EAM 자산을 찾을 수 없습니다.');return}
  if(String(a.status)==='폐기'){alert('이미 폐기 처리된 자산입니다.');return}
  const reason=prompt('폐기 사유를 입력하세요.','제품 교체'); if(reason===null)return;
  const date=prompt('폐기일을 입력하세요. (YYYY-MM-DD)',new Date().toISOString().slice(0,10)); if(date===null)return;
  const ur=await SUPA.from('assets').update({status:'폐기'}).eq('id',a.id);
  if(ur.error){console.error(ur.error);alert('폐기 처리에 실패했습니다.');return}
  const hr=await SUPA.from('asset_history').insert({asset_id:a.id,event_type:'폐기',description:`자산 폐기 · ${String(reason).trim()||'사유 미기재'}`,worker_name:'',action_type:'자산수명주기',cost:0,event_date:date});
  if(hr.error){console.error(hr.error);alert('폐기 이력 저장에 실패했습니다.');return}
  await eamLoad(); render();
}
async function eamRegisterReplacementAsset(){
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const oldCode=window.__eamSelCode||'';
  const old=(window.__eamA||[]).find(v=>String(v.asset_code)===String(oldCode));
  const category=old?.category||'기타설비';
  const name=prompt('새 제품 시설·설비명을 입력하세요.',old?.name||''); if(name===null)return;
  const place=prompt('설치 위치',old?.place||''); if(place===null)return;
  const code=prompt('새 자산번호',`AST-${Date.now()}`); if(code===null)return;

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function renderMonthYearCompare(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>
          <div class="myc-card">완료율<b class="v">${rate}%</b><div class="s">완료 건수 ÷ 접수 건수</div></div>
        </div>
        <table class="myc-table"><thead><tr><th>월</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전월 대비 접수</th></tr></thead>
        <tbody>${months.map(x=>{const r=x.z.received?Math.round(x.z.done/x.z.received*100):0; return `<tr><td><b>${x.m}월</b></td><td>${x.z.received}건</td><td class="myc-up">${x.z.done}건</td><td class="${x.z.miss?'myc-down':'myc-zero'}">${x.z.miss}건</td><td>${r}%</td><td class="${x.delta>0?'myc-up':x.delta<0?'myc-down':'myc-zero'}">${x.delta>0?"+":""}${x.delta}건</td></tr>`}).join("")}</tbody></table>`;
    }else{
      const years=[2025,2026];
      box.innerHTML=`
        <div class="myc-grid">
          ${years.map(y=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}if(y===2025&&!rec)rec=0;const rate=rec?Math.round(done/rec*100):0;return `<div class="myc-card"><b>${y}년</b><div class="v">${rec}건</div><div class="s">접수 · 완료 ${done}건 · 미완료 ${miss}건 · 완료율 ${rate}%</div></div>`}).join("")}
        </div>
        <table class="myc-table"><thead><tr><th>연도</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전년도 대비 접수</th></tr></thead>
        <tbody>${years.map((y,i)=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}const prev=i?((()=>{const q=d[years[i-1]]||{};let n=0;for(const m in q)n+=q[m].received;return n})()):0;const rate=rec?Math.round(done/rec*100):0;const delta=rec-prev;return `<tr><td><b>${y}년</b></td><td>${rec}건</td><td class="myc-up">${done}건</td><td class="${miss?'myc-down':'myc-zero'}">${miss}건</td><td>${rate}%</td><td class="${delta>0?'myc-up':delta<0?'myc-down':'myc-zero'}">${delta>0?"+":""}${delta}건</td></tr>`}).join("")}</tbody></table>`;
    }
  }
  window.showMonthYearCompare=function(mode){
    const sec=document.getElementById("monthYearCompare");
    if(!sec)return;
    sec.style.display="block";
    document.querySelectorAll("#monthYearCompare .myc-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    renderMonthYearCompare(mode);
    sec.scrollIntoView({behavior:"smooth",block:"start"});
  };
})();
</script>

<section id="monthYearCompare" style="display:none" class="myc-wrap">
  <div class="myc-head">
    <div><h2 style="margin:0">📈 월별 · 연도별 개선 현황</h2><div style="font-size:12px;color:#64748b;margin-top:4px">접수 건수를 기준으로 이전 기간과 비교</div></div>
    <div class="myc-tabs">
      <button data-mode="month" onclick="showMonthYearCompare('month')">월별 비교</button>
      <button data-mode="year" onclick="showMonthYearCompare('year')">연도별 비교</button>
    </div>
  </div>
  <div id="monthYearCompareBody"></div>
</section>
</body></html>
