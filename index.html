<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객접수</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;background:#edf4f8;color:#17324d}
  body{padding:12px}

  /* EAM 현황과 같은 컴팩트 헤더 크기 */
  .header{
    width:100%;
    height:100px;
    border-radius:14px;
    background:linear-gradient(135deg,#15577f,#0b6d9c);
    color:#fff;
    padding:20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 4px 12px rgba(24,60,90,.12);
  }
  .header-title{font-size:25px;font-weight:800;line-height:1.2}
  .header-sub{margin-top:6px;font-size:11px;opacity:.9}
  .header-status{
    border:1px solid rgba(255,255,255,.35);
    border-radius:9px;
    padding:9px 14px;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }

  /* 새 고객접수 화면은 넓게 사용 */
  .content{
    width:100%;
    margin-top:12px;
  }

  .card{
    width:100%;
    background:#fff;
    border:1px solid #d4e1eb;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 7px rgba(30,70,100,.06);
  }
  .card-head{
    height:46px;
    padding:0 16px;
    background:#f5f9fc;
    border-bottom:1px solid #dbe6ee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:16px;
    font-weight:800;
  }
  .card-head small{font-size:11px;font-weight:500;color:#72869a}
  .card-body{padding:16px}

  .history-grid{
    display:grid;
    grid-template-columns:120px 1fr 120px 1fr 120px 1fr;
    border-top:1px solid #d9e4ec;
    border-left:1px solid #d9e4ec;
  }
  .history-grid .label,
  .history-grid .value{
    min-height:48px;
    display:flex;
    align-items:center;
    padding:10px 12px;
    border-right:1px solid #d9e4ec;
    border-bottom:1px solid #d9e4ec;
  }
  .history-grid .label{
    background:#eef4f8;
    font-weight:700;
    color:#34536d;
    font-size:13px;
  }
  .history-grid .value{
    background:#fff;
    font-size:13px;
  }
  .history-grid .wide{grid-column:span 5}
  .status{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:6px;
    background:#eaf3ff;
    border:1px solid #9fc8f4;
    color:#1268b3;
    font-weight:800;
  }

  @media(max-width:900px){
    .header{height:100px;padding:18px}
    .history-grid{grid-template-columns:100px 1fr}
    .history-grid .label:nth-child(3),
    .history-grid .value:nth-child(4),
    .history-grid .label:nth-child(5),
    .history-grid .value:nth-child(6){display:none}
    .history-grid .wide{grid-column:auto}
  }
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-title">고객접수</div>
    <div class="header-sub">QR로 접수된 고객 의견과 주요 접수이력을 관리합니다.</div>
  </div>
  <div class="header-status">● QR 접수 수신 · 실시간</div>
</header>

<main class="content">
  <section class="card">
    <div class="card-head">
      <span>📄 주요 접수 이력카드</span>
      <small>고객접수</small>
    </div>

    <div class="card-body">
      <div class="history-grid">
        <div class="label">접수번호</div>
        <div class="value">-</div>
        <div class="label">접수유형</div>
        <div class="value">-</div>
        <div class="label">접수일시</div>
        <div class="value">-</div>

        <div class="label">접수장소</div>
        <div class="value">-</div>
        <div class="label">담당자</div>
        <div class="value">미지정</div>
        <div class="label">처리상태</div>
        <div class="value"><span class="status">접수대기</span></div>

        <div class="label">접수내용</div>
        <div class="value wide">-</div>

        <div class="label">상세내용</div>
        <div class="value wide">-</div>
      </div>
    </div>
  </section>
</main>

</body>
</html>
