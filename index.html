.jgb-selector{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.jgb-selector button{padding:12px 8px;border:1px solid #dbe4ee;background:#fff;border-radius:12px;cursor:pointer;font-weight:700}.jgb-selector button:hover,.jgb-selector button.sel{background:#0d6efd;color:#fff;border-color:#0d6efd}.jgb-detail{margin-top:12px;background:#f8fbfe;border:1px solid #dce7f1;border-radius:15px;padding:16px;min-height:170px}.jgb-detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.jgb-info{background:#fff;border:1px solid #e2e9f1;border-radius:10px;padding:10px}.jgb-info span{display:block;font-size:11px;color:#788696}.jgb-info b{display:block;margin-top:4px}
.jgb-eqgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.jgb-eqbtn{background:#fff;border:1px solid #dce5ee;border-radius:13px;padding:7px;cursor:pointer;text-align:left}.jgb-eqbtn:hover,.jgb-eqbtn.sel{border-color:#1769aa;box-shadow:0 7px 16px rgba(23,105,170,.12)}.jgb-eqbtn img{width:100%;height:70px;object-fit:cover;border-radius:8px;background:#eef3f8}.jgb-eqbtn b{display:block;font-size:11px;margin-top:6px}.jgb-eqbtn small{color:#748294}.jgb-eqdetail{display:grid;grid-template-columns:220px 1fr;gap:15px;margin-top:13px}.jgb-eqdetail img{width:220px;height:145px;object-fit:cover;border-radius:12px}.jgb-note{background:#eef6ff;border-left:4px solid #1877d1;padding:10px 12px;border-radius:8px}

function scheduleValues(date){
  const m=date.slice(0,7), day=Number(date.slice(8,10));
  if(m==="2026-09" && day>=1 && day<=30) return SEPT_2026[day-1];
  return db.schedule[date]||null;
}
function workersForDate(date){
  const vals=scheduleValues(date)||[];

function monthWorkingDays(wid, month){
  let n=0; const y=Number(month.slice(0,4)), m=Number(month.slice(5,7));
  const days=new Date(y,m,0).getDate();
  for(let d=1;d<=days;d++){
    const date=month+"-"+String(d).padStart(2,"0"), w=workersForDate(date).find(x=>x.id===wid);
    if(w&&w.working)n++;
  }

}
function completedBasicDays(wid, month){

  for(let d=1;d<=days;d++){

    if(w&&w.working){const k=date+"_"+wid, t=db.tasks[k]; if(t&&t.done&&t.done.length===10)n++;}
  }
  return n;
}

 <div class="panel"><h2>누수 관리 원칙</h2><div class="notice">A 1번 코트 인접 벽체<br>B 5번 코트 인접 벽체(좌측)<br>C 2·3번 코트 외부 천장<br>D 5번 코트 인접 벽체(우측)<br>E 여자 탈의실 천장</div><div class="small" style="margin-top:10px">직원 조치와 외부 수리·교체는 별도로 기록합니다.</div></div></div>`

<script id="REQUEST_RATE_RULE">
(function(){
  window.calcRequestRate = function(receivedCount, completedCount){
    receivedCount = Number(receivedCount)||0;
    completedCount = Number(completedCount)||0;
    if(receivedCount===0) return 0;
    return Math.round((completedCount/receivedCount)*100);
  };
})();
</script>

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function render(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>
          <div class="myc-card">완료율<b class="v">${rate}%</b><div class="s">완료 건수 ÷ 접수 건수</div></div>
        </div>
        <table class="myc-table"><thead><tr><th>월</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전월 대비 접수</th></tr></thead>
        <tbody>${months.map(x=>{const r=x.z.received?Math.round(x.z.done/x.z.received*100):0; return `<tr><td><b>${x.m}월</b></td><td>${x.z.received}건</td><td class="myc-up">${x.z.done}건</td><td class="${x.z.miss?'myc-down':'myc-zero'}">${x.z.miss}건</td><td>${r}%</td><td class="${x.delta>0?'myc-up':x.delta<0?'myc-down':'myc-zero'}">${x.delta>0?"+":""}${x.delta}건</td></tr>`}).join("")}</tbody></table>`;
    }else{
      const years=[2025,2026];
      box.innerHTML=`
        <div class="myc-grid">
          ${years.map(y=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}if(y===2025&&!rec)rec=0;const rate=rec?Math.round(done/rec*100):0;return `<div class="myc-card"><b>${y}년</b><div class="v">${rec}건</div><div class="s">접수 · 완료 ${done}건 · 미완료 ${miss}건 · 완료율 ${rate}%</div></div>`}).join("")}
        </div>
        <table class="myc-table"><thead><tr><th>연도</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전년도 대비 접수</th></tr></thead>
        <tbody>${years.map((y,i)=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}const prev=i?((()=>{const q=d[years[i-1]]||{};let n=0;for(const m in q)n+=q[m].received;return n})()):0;const rate=rec?Math.round(done/rec*100):0;const delta=rec-prev;return `<tr><td><b>${y}년</b></td><td>${rec}건</td><td class="myc-up">${done}건</td><td class="${miss?'myc-down':'myc-zero'}">${miss}건</td><td>${rate}%</td><td class="${delta>0?'myc-up':delta<0?'myc-down':'myc-zero'}">${delta>0?"+":""}${delta}건</td></tr>`}).join("")}</tbody></table>`;
    }
  }
  window.showMonthYearCompare=function(mode){
    const sec=document.getElementById("monthYearCompare");
    if(!sec)return;
    sec.style.display="block";
    document.querySelectorAll("#monthYearCompare .myc-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    render(mode);
    sec.scrollIntoView({behavior:"smooth",block:"start"});
  };
})();
</script>

      <button data-mode="year" onclick="showMonthYearCompare('year')">연도별 비교</button>
    </div>
  </div>
  <div id="monthYearCompareBody"></div>
