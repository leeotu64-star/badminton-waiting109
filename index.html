<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수리 LIVE 50:50</title>
<style>
/* 오른쪽 수리영역 전체: 위/아래 50:50 */
.repair-section {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
}

/* 위쪽 수리 LIVE */
.repair-live {
    flex: 0 0 50%;
    height: 50%;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
    overflow-x: auto;
    overflow-y: auto;
}

/* 아래쪽 추가 영역 */
.repair-add {
    flex: 0 0 50%;
    height: 50%;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
    border-top: 1px solid #c7d5e1;
}

/* 기존 비율값이 남아 있어도 50:50 유지 */
.repair-section .repair-live,
.repair-section .repair-add {
    max-width: 100%;
}

/* 수리 LIVE 표가 영역 밖으로 넘칠 경우 가로 스크롤 */
.repair-live table {
    min-width: 650px;
    width: 100%;
    border-collapse: collapse;
}

/* 하단 추가영역에는 스크롤바가 생기지 않도록 고정 */
.repair-add * {
    box-sizing: border-box;
}

/* ---------------------------------------
   실제 화면에 적용할 때의 기본 구조
   배치도 영역에는 이 클래스를 적용하지 않음
---------------------------------------- */
</style>
</head>
<body style="margin:0; height:100vh; background:#eef4f8;">

<div class="repair-section">

    <section class="repair-live">
        <div style="padding:12px 16px; font-weight:700; font-size:18px;">
            🔧 수리 LIVE
        </div>

        <table>
            <thead>
                <tr>
                    <th>자산코드</th>
                    <th>작업내용</th>
                    <th>수리상태</th>
                    <th>예정일</th>
                    <th>담당</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>AC-01</td><td>수리 작업</td><td>수리중</td><td>-</td><td>-</td></tr>
                <tr><td>AC-07</td><td>수리 작업</td><td>수리중</td><td>-</td><td>-</td></tr>
                <tr><td>AC-16</td><td>수리 작업</td><td>수리중</td><td>-</td><td>-</td></tr>
                <tr><td>OT-05</td><td>수리 작업</td><td>수리중</td><td>-</td><td>-</td></tr>
                <tr><td>FI-05</td><td>수리 작업</td><td>수리중</td><td>-</td><td>-</td></tr>
            </tbody>
        </table>
    </section>

    <section class="repair-add">
        <!-- 여기에 추가할 영역 -->
    </section>

</div>

</body>
</html>
