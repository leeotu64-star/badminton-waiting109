<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장군봉체육관 직원 시설 신고</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#f4f6f8;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:#222;
}
.wrap{
  width:min(92%,520px);
  margin:0 auto;
  padding:28px 0;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:24px;
  box-shadow:0 6px 24px rgba(0,0,0,.08);
}
h1{
  margin:0 0 8px;
  font-size:25px;
  text-align:center;
}
.sub{
  margin:0 0 24px;
  text-align:center;
  color:#666;
  font-size:14px;
}
label{
  display:block;
  margin:0 0 8px;
  font-weight:700;
  font-size:15px;
}
select,textarea,button{
  width:100%;
  font:inherit;
  border-radius:12px;
}
select,textarea{
  border:1px solid #d7dce1;
  background:#fff;
  padding:14px;
  outline:none;
}
select:focus,textarea:focus{
  border-color:#4b79ff;
}
textarea{
  min-height:150px;
  resize:vertical;
}
.group{margin-bottom:20px}
button{
  border:0;
  padding:15px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.msg{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}
.ok{
  display:block;
  background:#eaf7ee;
  color:#16733a;
}
.err{
  display:block;
  background:#fff0f0;
  color:#c62828;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>시설 불편사항 접수</h1>
    <p class="sub">장군봉체육관 직원용</p>

    <div class="group">
      <label for="mobileQrPlace">신고 위치</label>
      <select id="mobileQrPlace">
        <option value="">신고 위치를 선택하세요</option>
        <option value="남자 샤워실">남자 샤워실</option>
        <option value="여자 샤워실">여자 샤워실</option>
        <option value="여자 화장실">여자 화장실</option>
        <option value="복도">복도</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <div class="group">
      <label for="mobileQrContent">불편사항 / 고장내용</label>
      <textarea id="mobileQrContent" placeholder="시설의 불편사항이나 고장 내용을 입력하세요."></textarea>
    </div>

    <button id="submitBtn" onclick="addMobileQrIssue()">접수하기</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";
const SUPA=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function addMobileQrIssue(){
  const place=document.getElementById("mobileQrPlace").value;
  const content=document.getElementById("mobileQrContent").value.trim();
  const btn=document.getElementById("submitBtn");
  const msg=document.getElementById("msg");

  msg.className="msg";
  msg.textContent="";

  if(!place){
    msg.className="msg err";
    msg.textContent="신고 위치를 선택하세요.";
    return;
  }

  if(!content){
    msg.className="msg err";
    msg.textContent="불편사항이나 고장내용을 입력하세요.";
    return;
  }

  btn.disabled=true;
  btn.textContent="접수 중...";

  const now=new Date().toISOString();

  const {error}=await SUPA
    .from("requests")
    .insert([{
      category:"시설",
      place:place,
      content:content,
      status:"접수",
      received_at:now
    }]);

  btn.disabled=false;
  btn.textContent="접수하기";

  if(error){
    console.error(error);
    msg.className="msg err";
    msg.textContent="접수에 실패했습니다. 잠시 후 다시 시도해주세요.";
    return;
  }

  msg.className="msg ok";
  msg.textContent="시설 불편사항이 정상적으로 접수되었습니다.";

  document.getElementById("mobileQrPlace").value="";
  document.getElementById("mobileQrContent").value="";
}
</script>
</body>
</html>
