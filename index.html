function scheduleValues(date){
  if(db.schedule && Array.isArray(db.schedule[date])) return db.schedule[date];

function monthWorkingDays(wid, month){
  let n=0; const y=Number(month.slice(0,4)), m=Number(month.slice(5,7));
  const days=new Date(y,m,0).getDate();
  const limit=month===monthKey()?Number(selectedDate.slice(8,10)):days;
  for(let d=1;d<=Math.min(days,limit);d++){
    const date=month+"-"+String(d).padStart(2,"0"), w=workersForDate(date).find(x=>x.id===wid);
    if(w&&w.working)n++;
  }

}

  });

function compareRows(s){return `<div class="compareline">접수 <b>${s.is.length}건</b></div><div class="compareline">조치완료 <b>${s.done.length}건</b></div><div class="compareline">미조치 <b class="red">${s.pending.length}건</b></div>`}
function yearRows(s){return `<div class="compareline">2025년 접수 <b>0건</b></div><div class="compareline">2026년 접수 <b>${s.is.length}건</b></div><div class="compareline">2025년 조치완료 <b>0건</b></div><div class="compareline">2026년 조치완료 <b>${s.done.length}건</b></div><div class="compareline">2026년 미조치 <b>${s.pending.length}건</b></div>`}
function workerRow(w){const d=tasksFor(w.id), mine=(db.issues||[]).filter(x=>x.handlerId===w.id&&String(x?.createdAt||'').slice(0,7)===monthKey()), md=mine.filter(x=>x.status!=="완료").length, bs=basicWorkerStats(w.id,monthKey());return `<tr><td><b>${w.name}</b></td><td>${w.shift}<br>${w.start?`${w.start}~${w.end}`:"-"}</td><td><span class="badge ${w.working?"":"off"}">${w.working?"근무":"휴무"}</span></td><td>${w.working?`${bs.complete}/${bs.target}일`:"-"}</td><td>${w.working?mine.filter(x=>x.status==="완료").length:"-"}</td><td class="${md?"red":"green"}"><b>${w.working?md:"-"}</b></td><td><b>${mine.length}건</b></td></tr>`}
function qrRequestPage(){const A=(window.__eamA||[]).filter(a=>String(a.status||'')!=='폐기').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));return `<div class="jgb-mobile qr-mobile"><div class="mobile-brand">🛡 장군봉체육관</div><div class="mobile-hero"><span>시설 이상 신고</span><b>직원용 통합 신고</b><small>QR 하나로 신고하고, 관리자가 작업으로 처리합니다.</small></div><div class="jgb-card qr-card"><div class="qr-step"><i>1</i><div><b>시설·설비 선택</b><small>고장난 설비를 선택하면 EAM 자산과 자동 연결됩니다.</small></div></div><div class="jgb-field"><label>시설·설비 <em>필수</em></label><select id="qrAssetCode" onchange="qrAssetChanged(this.value)"><option value="">시설·설비를 선택하세요</option>${A.map(a=>`<option value="${xEsc(a.asset_code)}">${xEsc(a.name)} · ${xEsc(a.place||'-')} · ${xEsc(a.asset_code)}</option>`).join('')}</select></div><div id="qrAssetInfo" class="qr-asset-info">설비를 선택하면 위치와 자산번호가 표시됩니다.</div><div class="qr-step"><i>2</i><div><b>이상 내용</b><small>현장에서 확인한 증상을 적어주세요.</small></div></div><div class="jgb-field"><label>고장·이상 내용 <em>필수</em></label><textarea id="content" rows="5" placeholder="예: 주펌프에서 평소보다 큰 소음이 발생합니다."></textarea></div><div class="qr-step"><i>3</i><div><b>현장 사진</b><small>카메라로 바로 촬영할 수 있습니다.</small></div></div><div class="jgb-field"><input id="photo" type="file" accept="image/*" capture="environment"></div><button id="intakeBtn" class="jgb-btn qr-submit" style="width:100%" onclick="addQrIssue()">신고 등록</button><div class="qr-foot">등록 즉시 관리자 작업관리로 전달됩니다.</div></div></div>`;}
function qrAssetChanged(code){const a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));const box=document.getElementById('qrAssetInfo');if(box)box.innerHTML=a?`<b>${xEsc(a.name||'시설·설비')}</b><span>${xEsc(a.place||'-')} · 자산번호 ${xEsc(a.asset_code||'-')}</span>`:'설비를 선택하면 위치와 자산번호가 표시됩니다.';}
async function addQrIssue(){const c=document.getElementById('content')?.value.trim(),code=document.getElementById('qrAssetCode')?.value||'',a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));if(!a){alert('시설·설비를 먼저 선택하세요.');return}if(!c){alert('고장·이상 내용을 입력하세요.');return}if(!SUPA){alert('Supabase 연결이 필요합니다.');return}const btn=document.getElementById('intakeBtn');if(btn)btn.disabled=true;try{let photo_url='';const f=document.getElementById('photo')?.files?.[0];if(f){const path=`${Date.now()}_${f.name.replace(/[^\w가-힣.\-]/g,'_')}`;const up=await SUPA.storage.from('request-photos').upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+'/storage/v1/object/public/request-photos/'+path}const now=new Date().toISOString();const r=await SUPA.from('requests').insert({category:a.category||'시설',place:a.place||'',content:`[${a.asset_code}] ${c}`,photo_url,status:'접수',received_at:now});if(r.error)throw r.error;const eh=await SUPA.from('asset_history').insert({asset_id:a.id,event_type:'작업요청',description:c,worker_name:'직원 신고',action_type:'직원신고',cost:0,event_date:now.slice(0,10)});if(eh.error)console.warn('EAM 작업요청 이력 자동등록 실패',eh.error);alert('신고가 등록되었습니다. 관리자 작업관리로 전달됩니다.');location.href=location.pathname+'?page=process'}catch(e){console.error(e);alert('신고 등록에 실패했습니다.\n'+(e?.message||'Supabase 권한 또는 연결을 확인하세요.'))}finally{if(btn)btn.disabled=false}}

function registerPage(){const defaultCat="시설";const places=PLACE_GROUPS[defaultCat]||PLACE_OPTIONS;const presets=ISSUE_PRESETS[defaultCat]||[];return `<div class="pagebar"><h1>시설·환경·안전 접수</h1><button class="btn gray" onclick="go('dashboard')">종합 대시보드</button></div><div class="notice">구분과 장소를 선택하면 해당 시설에 맞는 장소·접수사항이 자동으로 표시됩니다. 등록자 이름은 저장하지 않습니다.</div><div class="panel"><div class="formgrid"><div class="field"><label>구분</label><select id="cat" onchange="updateRegisterOptions()"><option>시설</option><option>환경</option><option>안전</option><option>기타</option></select></div><div class="field"><label>접수 장소</label><select id="place"><option value="">장소를 선택하세요</option>${places.map(p=>`<option value="${p}">${p}</option>`).join("")}</select></div><div class="field full"><label>시설·접수사항 선택</label><select id="issuePreset" onchange="applyIssuePreset()"><option value="">내용을 선택하세요</option>${presets.map(v=>`<option value="${v}">${v}</option>`).join("")}<option value="직접입력">직접입력</option></select></div><div class="field full"><label>상세 내용</label><textarea id="content" rows="3" placeholder="위 목록에서 선택하거나 필요한 경우 상세 내용을 입력하세요"></textarea></div><div class="field full"><label>사진(선택)</label><input id="photo" type="file" accept="image/*"></div></div><button class="btn" style="margin-top:10px" onclick="addIssue()">접수 등록</button></div><div class="panel" style="margin-top:10px"><h2>최근 접수</h2>${db.issues.slice(-8).reverse().map(x=>`<div class="issue"><div><b>${x.category} · ${x.place}</b><br>${x.content}<div class="small">접수 ${time(x.createdAt)}</div></div><div class="status ${x.status==="완료"?"green":"red"}">${x.status}</div></div>`).join("")||"<div class='small'>접수된 사항이 없습니다.</div>"}</div>`}
function updateRegisterOptions(){const cat=document.getElementById("cat")?.value||"시설",place=document.getElementById("place"),preset=document.getElementById("issuePreset");if(place){const arr=PLACE_GROUPS[cat]||PLACE_OPTIONS;place.innerHTML='<option value="">장소를 선택하세요</option>'+arr.map(p=>`<option value="${p}">${p}</option>`).join("")}if(preset){const arr=ISSUE_PRESETS[cat]||[];preset.innerHTML='<option value="">내용을 선택하세요</option>'+arr.map(v=>`<option value="${v}">${v}</option>`).join("")+ '<option value="직접입력">직접입력</option>';preset.value=""}}
function applyIssuePreset(){const v=document.getElementById("issuePreset")?.value||"",ta=document.getElementById("content");if(!ta)return;if(v&&v!=="직접입력")ta.value=v;else if(v==="직접입력"){ta.value="";ta.focus()}}
const ACTION_TYPES=['자체조치','외부용역'];
function actionTypeFromIssue(x){if(x&&ACTION_TYPES.includes(x.actionType))return x.actionType;const m=String(x?.content||'').match(/\[\[처리구분:(자체조치|외부용역)\]\]/);return m?m[1]:''}
function cleanIssueContent(x){return String(x?.content||'').replace(/\s*\[\[처리구분:(?:자체조치|외부용역)\]\]/g,'').trim()}
function withActionMarker(content,type){const base=String(content||'').replace(/\s*\[\[처리구분:(?:자체조치|외부용역)\]\]/g,'').trim();return type?base+' [[처리구분:'+type+']]':base}
async function setActionType(id,type){const x=(db.issues||[]).find(i=>i.id===id);if(!x||!type)return;x.actionType=type;x.content=withActionMarker(x.content,type);if(x.remoteId){const r=await SUPA.from('requests').update({content:x.content}).eq('id',x.remoteId);if(r.error){alert('처리구분 저장에 실패했습니다.');return}}await syncFromSupabase()}
function processPage(){const pending=(db.issues||[]).filter(x=>x.status!=='완료');return `<div class="jgb-page-title"><div><h2>작업관리 · 조치 처리</h2><p>직원 신고 → 담당자 지정 → 처리구분 → 조치완료</p></div><button class="jgb-btn gray" onclick="syncFromSupabase()">새로고침</button></div><div class="jgb-section">처리 대기 ${pending.length}건</div><div class="jgb-card"><div class="jgb-queue">${pending.map(x=>{const at=actionTypeFromIssue(x);return `<div class="jgb-q"><div><b>${x.category} · ${x.place}</b>${x.assetCode?` <span class="jgb-status asset">${x.assetCode}</span>`:''}<br><small>${xEsc(cleanIssueContent(x))}</small><br><small>접수 ${time(x.createdAt)} ${x.startedAt?'· 시작 '+time(x.startedAt):''} ${x.handlerName?'· 담당 '+x.handlerName:''}</small>${x.photo_url?`<br><a href="${x.photo_url}" target="_blank">사진 보기</a>`:''}<div style="margin-top:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap"><span class="small" style="margin:0;font-weight:900">처리구분</span><select onchange="setActionType('${x.id}',this.value)"><option value="">선택</option>${ACTION_TYPES.map(v=>`<option value="${v}" ${at===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div>${x.handlerId?`<button class="jgb-btn green" ${at?'':'disabled title="처리구분을 선택하세요"'} onclick="completeIssue('${x.id}')">조치완료</button>`:`<select onchange="assign('${x.id}',this.value)"><option value="">담당자 선택</option>${workers.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select>`}</div></div>`}).join('')||'<div class="jgb-empty">처리할 작업이 없습니다.</div>'}</div></div>`}
function saveScheduleDay(date){
  const vals=workers.map(w=>document.getElementById(`sch_${w.id}`)?.value||"");
  if(!db.schedule||typeof db.schedule!=="object")db.schedule={};
  db.schedule[date]=vals;
  save();
  alert(`${date} 근무편성이 저장되었습니다.\n기본업무·직원실적에 즉시 반영됩니다.`);
  render();
}

  return `<div class="jgb-page-title"><div><h2>근무편성</h2><p>${selectedDate} 근무편성표 · 저장된 편성은 기본업무와 직원실적에 자동 연동됩니다.</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="date" value="${selectedDate}" onchange="setDate(this.value)"><button class="btn blue" onclick="saveScheduleDay('${selectedDate}')">편성 저장</button></div></div>
  <div class="notice"><b>근무편성 → 자동 연동</b><br>근무 상태가 ‘근무’인 직원만 기본업무 10개 항목의 대상이 되며, 휴무·주휴일·연가·공가·대체휴무는 자동 제외됩니다. 편성을 저장하면 기본업무·직원실적 화면이 같은 날짜 기준으로 즉시 반영됩니다.</div>
  <div class="jgb-card"><table class="schedule-table"><thead><tr><th>직원</th><th>근무편성</th><th>근무시간</th><th>기본업무 대상</th></tr></thead><tbody>${workers.map((w,i)=>{
    const st=vals[i]||"";

    const opts=["","새벽조","오전조","오후조","휴무","주휴일","연가","공가/건강검진","대체휴무","8/15대체휴무","8/17대체휴무","9/24대체휴무","9/25대체휴무"];
    return `<tr><td><b>${xEsc(w.name)}</b></td><td><select id="sch_${w.id}" style="min-width:150px"><option value="">편성없음</option>${opts.filter(Boolean).map(o=>`<option value="${xEsc(o)}" ${st===o?"selected":""}>${xEsc(o)}</option>`).join("")}</select></td><td>${tm}</td><td class="${working?'schedule-working':'schedule-off'}">${working?'대상':'제외'}</td></tr>`;

async function eamLoad(){
  window.__eamA=window.__eamA||[];
  window.__eamH=window.__eamH||[];
  window.__eamI=window.__eamI||[];
  if(!SUPA)return;
  try{
    const [a,h,i]=await Promise.all([
      SUPA.from("assets").select("*").order("name"),
      SUPA.from("asset_history").select("*").order("event_date",{ascending:false}),
      SUPA.from("inspections").select("*").order("inspection_date",{ascending:false})
    ]);
    if(a.error)throw a.error;
    window.__eamA=a.data||[];
    window.__eamH=h.data||[];
    window.__eamI=i.data||[];
  }catch(e){console.warn("EAM 동기화 실패",e)}
}

function eamSourceAssets(){
  const main=Array.isArray(JGB_MAIN_EQUIPMENT)?JGB_MAIN_EQUIPMENT:[];
  const excel=Array.isArray(JGB_EXCEL_EQUIPMENT)?JGB_EXCEL_EQUIPMENT:[];
  const rows=[...main,...excel]
    .filter(x=>x && x.code)
    .filter(x=>!["OT-04","OT-05","OT-06"].includes(String(x.code)))
    .map(x=>({
      code:String(x.code),
      name:String(x.name||"-"),
      type:String(x.type||"기타설비"),
      place:String(String(x.type||"").includes('소방')?'유수장치실':(x.place||"-")),
      model:String(x.model||x.capacity||"-"),
      qty:x.quantity??x.quantity??"-",
      vendor:String(x.vendor||x.maker||"-"),
      asContact:String(x.asContact||x.contact||"-"),
      installDate:String(x.installDate||x.date||"-"),
      warranty:String(x.warranty||"-"),
      asHistory:String(x.asHistory||"-"),
      note:String(x.note||"-"),
      photo:x.photo||null
    }));
  const map=new Map();
  rows.forEach(x=>{ if(!map.has(x.code)) map.set(x.code,x); });
  return [...map.values()];
}
function eamDisplayName(x){
  const code=String(x?.code||"");
  if(code.startsWith("FI-")){
    const m=String(x?.model||"").trim();
    if(m && m!=="-") return m;
    if(code==="FI-01") return "소방설비 · FI-01";
    return String(x?.name||"소방설비");
  }
  return String(x?.name||"-");
}
function eamSourceCategory(x){
  const t=String(x.type||"");
  if(t.includes("냉난방")) return "cooling";
  if(t.includes("소방")) return "fire";
  if(t.includes("온수")||t.includes("보일러")||t.includes("난방")) return "water";
  if(t.includes("전기")) return "electrical";
  if(t.includes("조명")) return "lighting";
  if(t.includes("방수")) return "waterproof";
  return "other";
}
function eamCategoryDefs(){
  const src=eamSourceAssets();
  const defs=[
    ["cooling","❄️","냉난방","냉방기 · 실외기"],
    ["fire","🚒","소방·방재","펌프 · 밸브 · 제어"],
    ["water","♨️","온수·난방","온수기 · 조절기 · 난방"],
    ["electrical","⚡","전기설비","분전반"],
    ["lighting","💡","코트조명","조명 · 전동릴"],
    ["waterproof","🏗️","방수","지붕 · 방수"],
    ["other","🔧","기타설비","사무 · 공용"]
  ];
  const out={};
  defs.forEach(([k,ico,label,desc])=>{
    out[k]={ico,label,desc,items:src.filter(x=>eamSourceCategory(x)===k)};
  });
  return out;
}

function eamProFilter(q){

function leakagePage(){
  const A=window.__eamA||[],H=window.__eamH||[];
  const leaks=A.filter(a=>{
    const c=String(a.category||"").toLowerCase();
    const n=String(a.name||"").toLowerCase();
    return c.includes("누수") || n.includes("누수");
  });
  const allH=H.filter(v=>leaks.some(a=>String(v.asset_id)===String(a.id)));
  const open=leaks.filter(a=>String(a.status||"정상")!=="정상").length;
  return `<div class="leak-final">
    <div class="leak-head"><div><div class="eyebrow">SEPARATE FACILITY ISSUE</div><h1>💧 누수관리</h1><p>EAM 자산과 섞지 않고 등록된 누수 자산만 별도로 관리합니다.</p></div><div class="actions"><button class="btn blue" onclick="eamRegisterNewAsset('누수관리')">＋ 누수 신규 등록</button><button class="btn gray" onclick="eamLoad().then(render)">↻ 새로고침</button></div></div>
    <div class="leak-kpis"><div><small>등록 누수</small><b>${leaks.length}</b><span>현재 DB 기준</span></div><div><small>조치 필요</small><b>${open}</b><span>정상 외 상태</span></div><div><small>누수 이력</small><b>${allH.length}</b><span>연결 작업 이력</span></div></div>
    ${leaks.length?`<div class="leak-grid">${leaks.map(a=>{const hs=H.filter(v=>String(v.asset_id)===String(a.id));const last=hs[0];return `<article class="leak-card ${String(a.status)==='정상'?'':'open'}"><div class="leak-code">${xEsc(a.asset_code)}</div><h3>${xEsc(a.name)}</h3><p>${xEsc(a.place||"-")}</p><div class="leak-line"><span>상태</span><b>${xEsc(a.status||"정상")}</b></div><div class="leak-line"><span>조치 이력</span><b>${hs.length}건</b></div><div class="leak-line"><span>최근 이력</span><b>${last?time(last.event_date):"-"}</b></div></article>`}).join("")}</div>`:
    `<div class="leak-empty"><b>현재 등록된 누수 자산이 없습니다.</b><span>임의의 누수 위치를 자동으로 만들지 않습니다. 실제 누수 항목을 신규 등록하면 이곳에 표시됩니다.</span></div>`}
  </div>`;
}

async function eamEditSelectedAsset(){
  const code=window.__eamSelCode||''; if(!code){alert('수정할 시설·설비를 선택하세요.');return}

async function eamDeleteSelectedAsset(){

  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const a=(window.__eamA||[]).find(v=>String(v.asset_code)===String(code));

async function eamRegisterReplacementAsset(){
  if(!SUPA){alert('Supabase 연결이 필요합니다.');return}
  const oldCode=window.__eamSelCode||'';
  const old=(window.__eamA||[]).find(v=>String(v.asset_code)===String(oldCode));
  const category=old?.category||'기타설비';
  const name=prompt('새 제품 시설·설비명을 입력하세요.',old?.name||''); if(name===null)return;
  const place=prompt('설치 위치',old?.place||''); if(place===null)return;
  const code=prompt('새 자산번호',`AST-${Date.now()}`); if(code===null)return;
  const installDate=prompt('신규 설치일 (YYYY-MM-DD)',new Date().toISOString().slice(0,10)); if(installDate===null)return;
  if(!String(name).trim()||!String(place).trim()||!String(code).trim()){alert('시설·설비명, 설치 위치, 자산번호는 필수입니다.');return}
  const ar=await SUPA.from('assets').insert({asset_code:String(code).trim(),name:String(name).trim(),category,place:String(place).trim(),status:'정상',product_name:category}).select('id,asset_code,name,category,place').single();
  if(ar.error){console.error(ar.error);alert('새 자산 등록에 실패했습니다. 자산번호가 중복인지 확인하세요.');return}
  const newA=ar.data;
  if(old){
    const desc=`신규 자산 ${newA.asset_code} 등록 · ${installDate} 설치 · 기존 자산 ${old.asset_code} 교체`;
    const hr=await SUPA.from('asset_history').insert({asset_id:old.id,event_type:'자산교체',description:desc,worker_name:'',action_type:'자산수명주기',cost:0,event_date:installDate});
    if(hr.error){console.error(hr.error);alert('교체 관계 이력 저장에 실패했습니다. 새 자산은 등록되었으니 확인하세요.');return}
  }
  window.__eamSelCode=newA.asset_code; await eamLoad(); render();
}

async function addIssue(){const c=document.getElementById("content").value.trim(),p=document.getElementById("place").value,cat=document.getElementById("cat").value;if(!c||!p){alert("접수 장소와 접수사항을 입력하세요.");return}const btn=document.getElementById("intakeBtn");if(btn)btn.disabled=true;let photo_url="";try{const f=document.getElementById("photo")?.files?.[0];if(f){const path=`${Date.now()}_${f.name.replace(/[^\w가-힣.\-]/g,"_")}`;const up=await SUPA.storage.from("request-photos").upload(path,f,{upsert:false});if(up.error)throw up.error;photo_url=SUPABASE_URL+"/storage/v1/object/public/request-photos/"+path}const now=new Date().toISOString();const ins=await SUPA.from("requests").insert({category:cat,place:p,content:c,photo_url,status:"접수",received_at:now});if(ins.error)throw ins.error;alert("접수가 완료되었습니다.");document.getElementById("content").value="";if(document.getElementById("photo"))document.getElementById("photo").value="";await syncFromSupabase();go("process")}catch(e){console.error(e);alert("접수에 실패했습니다. Supabase 연결을 확인하세요.")}finally{if(btn)btn.disabled=false}}
async function assign(id,wid){const x=db.issues.find(i=>i.id===id);if(!x||!wid)return;const w=workers.find(v=>v.id===wid);if(!w)return;const started=x.startedAt||new Date().toISOString();if(x.remoteId){const r=await SUPA.from("requests").update({handler_name:w.name,status:"조치중",started_at:started}).eq("id",x.remoteId);if(r.error){alert("담당 직원 저장에 실패했습니다.");return}}await syncFromSupabase()}

async function syncBasicTasks(){if(!SUPA)return;try{const {data,error}=await SUPA.from("basic_tasks").select("*");if(error)throw error;const t={};(data||[]).forEach(r=>{const name=taskDisplayName(r.task_name);if(!name)return;const k=r.work_date+"_"+r.worker_id;(t[k]??={done:[],updatedAt:null}).done.push(name);t[k].updatedAt=r.completed_at||null});db.tasks=t;save()}catch(e){console.warn("기본업무 동기화 실패",e)}}
async function toggleTask(wid,t){const d=tasksFor(wid),idx=d.done.indexOf(t);if(idx>=0)d.done.splice(idx,1);else d.done.push(t);d.updatedAt=new Date().toISOString();render();if(!SUPA)return;try{const q=SUPA.from("basic_tasks");const dbName=taskDbName(t);if(idx>=0){const {error}=await q.delete().eq("work_date",dateKey()).eq("worker_id",wid).eq("task_name",dbName);if(error)throw error}else{const {error}=await q.insert({work_date:dateKey(),worker_id:wid,task_name:dbName,completed_at:new Date().toISOString()});if(error)throw error}await syncBasicTasks();render()}catch(e){console.warn(e);if(idx>=0)d.done.push(t);else d.done=d.done.filter(x=>x!==t);render();alert("기본업무 저장에 실패했습니다. Supabase 권한/컬럼을 확인하세요.")}}
function setDate(v){if(v){selectedDate=v;render()}}
function time(v){return new Date(v).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}
function seedDemo(){if(db.issues.length)return alert("이미 테스트 데이터가 있습니다.");let now=Date.now();db.issues=[{id:"I"+now,category:"시설",place:"2층 남자화장실",content:"조명 점검 필요",status:"미조치",createdAt:new Date(now-35*60000).toISOString(),handlerId:"w1",handlerName:"김민수",completedAt:""},{id:"I"+(now+1),category:"환경",place:"복도",content:"바닥 청소 요청",status:"완료",createdAt:new Date(now-70*60000).toISOString(),handlerId:"w2",handlerName:"이현우",completedAt:new Date(now-25*60000).toISOString()}];save();render()}
function resetAll(){if(confirm("테스트 데이터를 모두 삭제할까요?")){db={issues:[],tasks:{},schedule:{}};save();render()}}
(function(){
  window.eamPick=eamPick; window.eamHistoryTab=eamHistoryTab; window.eamShowLocation=eamShowLocation; window.eamShowHistory=eamShowHistory;
  if(!window.__eamClickBound){

    document.addEventListener('click',function(ev){

<script id="REQUEST_RATE_RULE">
(function(){
  window.calcRequestRate = function(receivedCount, completedCount){
    receivedCount = Number(receivedCount)||0;
    completedCount = Number(completedCount)||0;
    if(receivedCount===0) return 0;
    return Math.round((completedCount/receivedCount)*100);
  };
})();
</script>

<script id="MONTH_YEAR_COMPARE_JS">
(function(){
  const baseMonths={2026:{8:0}};
  const baseYears={2025:0};
  function state(){
    try{
      const keys=["JGB_LIVE_TEST_V2","JGB_FACILITY_LIVE","JGB_LIVE_TEST"];
      for(const k of keys){const v=localStorage.getItem(k);if(v){const s=JSON.parse(v);if(s&&typeof s==="object")return s;}}
    }catch(e){}
    return {};
  }
  function issues(s){
    return s.issues||s.requests||s.items||s.receipts||[];
  }
  function monthKey(x){
    const t=x.receivedAt||x.createdAt||x.time||x.date||"";
    const m=String(t).match(/(20\d\d)[-/.](\d\d?)/);
    return m?m[1]+"-"+String(m[2]).padStart(2,"0"):"";
  }
  function annualData(){
    const s=state(), arr=issues(s), out={};
    for(const x of arr){
      const k=monthKey(x); if(!k) continue;
      const [y,m]=k.split("-").map(Number);
      out[y]??={}; out[y][m]??={received:0,done:0,miss:0};
      out[y][m].received++;
      if(x.completed||x.status==="completed"||x.status==="done"||x.handledAt) out[y][m].done++;
      else out[y][m].miss++;
    }
    return out;
  }
  function renderMonthYearCompare(mode){
    const box=document.getElementById("monthYearCompareBody"); if(!box)return;
    const d=annualData(), now=new Date(), cy=now.getFullYear(), cm=now.getMonth()+1;
    if(mode==="month"){
      const months=[];
      for(let m=1;m<=12;m++){
        const z=(d[cy]&&d[cy][m])||{received:0,done:0,miss:0};
        if(cy===2026 && m===8 && !d[cy]?.[m]) z.received=z.done=z.miss=0;
        const prev=(m===1?{received:0,done:0,miss:0}:((d[cy]&&d[cy][m-1])||{received:0,done:0,miss:0}));
        const delta=z.received-prev.received;
        months.push({m,z,delta});
      }
      const cur=(d[cy]&&d[cy][cm])||{received:0,done:0,miss:0};
      const rate=cur.received?Math.round(cur.done/cur.received*100):0;
      box.innerHTML=`
        <div class="myc-grid">
          <div class="myc-card">현재 월 접수<b class="v">${cur.received}건</b><div class="s">${cy}년 ${cm}월</div></div>
          <div class="myc-card">현재 월 완료<b class="v myc-up">${cur.done}건</b><div class="s">조치완료</div></div>
          <div class="myc-card">현재 월 미완료<b class="v myc-down">${cur.miss}건</b><div class="s">아직 완료되지 않은 건</div></div>
          <div class="myc-card">완료율<b class="v">${rate}%</b><div class="s">완료 건수 ÷ 접수 건수</div></div>
        </div>
        <table class="myc-table"><thead><tr><th>월</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전월 대비 접수</th></tr></thead>
        <tbody>${months.map(x=>{const r=x.z.received?Math.round(x.z.done/x.z.received*100):0; return `<tr><td><b>${x.m}월</b></td><td>${x.z.received}건</td><td class="myc-up">${x.z.done}건</td><td class="${x.z.miss?'myc-down':'myc-zero'}">${x.z.miss}건</td><td>${r}%</td><td class="${x.delta>0?'myc-up':x.delta<0?'myc-down':'myc-zero'}">${x.delta>0?"+":""}${x.delta}건</td></tr>`}).join("")}</tbody></table>`;
    }else{
      const years=[2025,2026];
      box.innerHTML=`
        <div class="myc-grid">
          ${years.map(y=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}if(y===2025&&!rec)rec=0;const rate=rec?Math.round(done/rec*100):0;return `<div class="myc-card"><b>${y}년</b><div class="v">${rec}건</div><div class="s">접수 · 완료 ${done}건 · 미완료 ${miss}건 · 완료율 ${rate}%</div></div>`}).join("")}
        </div>
        <table class="myc-table"><thead><tr><th>연도</th><th>접수</th><th>완료</th><th>미완료</th><th>완료율</th><th>전년도 대비 접수</th></tr></thead>
        <tbody>${years.map((y,i)=>{const months=d[y]||{};let rec=0,done=0,miss=0;for(const m in months){rec+=months[m].received;done+=months[m].done;miss+=months[m].miss}const prev=i?((()=>{const q=d[years[i-1]]||{};let n=0;for(const m in q)n+=q[m].received;return n})()):0;const rate=rec?Math.round(done/rec*100):0;const delta=rec-prev;return `<tr><td><b>${y}년</b></td><td>${rec}건</td><td class="myc-up">${done}건</td><td class="${miss?'myc-down':'myc-zero'}">${miss}건</td><td>${rate}%</td><td class="${delta>0?'myc-up':delta<0?'myc-down':'myc-zero'}">${delta>0?"+":""}${delta}건</td></tr>`}).join("")}</tbody></table>`;
    }
  }
  window.showMonthYearCompare=function(mode){
    const sec=document.getElementById("monthYearCompare");
    if(!sec)return;
    sec.style.display="block";
    document.querySelectorAll("#monthYearCompare .myc-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
    renderMonthYearCompare(mode);
    sec.scrollIntoView({behavior:"smooth",block:"start"});
  };
})();
</script>

<section id="monthYearCompare" style="display:none" class="myc-wrap">
  <div class="myc-head">
    <div><h2 style="margin:0">📈 월별 · 연도별 개선 현황</h2><div style="font-size:12px;color:#64748b;margin-top:4px">접수 건수를 기준으로 이전 기간과 비교</div></div>
    <div class="myc-tabs">
      <button data-mode="month" onclick="showMonthYearCompare('month')">월별 비교</button>
      <button data-mode="year" onclick="showMonthYearCompare('year')">연도별 비교</button>
    </div>
  </div>
  <div id="monthYearCompareBody"></div>
</section>
