<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업무 수행현황</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;background:#eef5f9;color:#123b61}body{padding:22px}
.wrap{max-width:1380px;margin:0 auto;background:#fffdf7;border:1px solid #d9cfbd;border-radius:16px;padding:10px;box-shadow:0 5px 18px rgba(35,55,70,.08)}
.header{height:92px;background:#0e6695;color:#fff;border-radius:13px;padding:16px 22px;position:relative;overflow:hidden}.header:after{content:"";position:absolute;right:-30px;top:-55px;width:210px;height:210px;border:1px solid rgba(255,255,255,.18);border-radius:50%}.title{font-size:29px;font-weight:900;line-height:1.1}.sub{margin-top:9px;font-size:14px;font-weight:700}.date{position:absolute;right:20px;top:24px;background:#fff;color:#245274;border-radius:9px;padding:11px 15px;font-size:12px;z-index:2}
.note{position:relative;margin-top:28px;background:#fffdf8;border:1px solid #d8cdbb;border-radius:12px;padding:34px 22px 20px;box-shadow:0 3px 10px rgba(40,50,55,.06);overflow:visible}
.spring{position:absolute;top:-17px;left:34px;right:34px;height:30px;display:flex;justify-content:space-around;align-items:center;z-index:3}.ring{width:27px;height:17px;border:3px solid #687b83;border-bottom-color:transparent;border-radius:50% 50% 0 0;transform:rotate(3deg);background:transparent}.paper-title{font-size:28px;font-weight:900;border-bottom:1px solid #ddd5c7;padding:0 8px 14px}.meta{display:flex;justify-content:space-between;align-items:center;padding:13px 8px;border-bottom:1px solid #e2dace}.shift{display:inline-block;background:#e9f7ef;color:#00865c;border-radius:18px;padding:7px 12px;font-size:13px;font-weight:800}.count{background:#edf4fb;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:900;color:#1a5d8d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:8px}.task{min-height:62px;padding:12px 14px;border-bottom:1px solid #d9d2c6;display:flex;align-items:center;gap:12px;font-size:16px}.task:nth-child(odd){border-right:1px solid #d9d2c6}.task.done{background:#eef9f2}.ico{width:32px;height:32px;border-radius:9px;background:#edf5fa;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.no{font-size:12px;color:#58738b;width:26px}.txt{font-weight:800;flex:1}.state{font-size:13px;font-weight:900;color:#1268a6}.done .state{color:#008653}.foot{display:flex;justify-content:space-between;padding:12px 8px 0;font-size:13px;font-weight:700}.foot b{font-size:17px;color:#0068b1}
@media(max-width:800px){body{padding:10px}.header{height:100px}.date{right:12px;top:55px}.grid{grid-template-columns:1fr}.task:nth-child(odd){border-right:0}.spring{left:10px;right:10px}.note{padding-left:12px;padding-right:12px}}
</style></head><body><main class="wrap"><header class="header"><div class="title">오늘의 기본업무</div><div class="sub">2026-09-23 · 시설 이용환경을 꼼꼼히 확인해 주세요. · 전체 약 40분 소요 · 차근차근 점검해 주세요.</div><div class="date">2026-09-23　▣</div></header>
<section class="note"><div class="spring"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span></div><div class="paper-title">업무 수행현황</div><div class="meta"><span class="shift">새벽조 · 06:00~15:00</span><span class="count">직접 실시 · 8/10</span></div><div class="grid"><div class="task done"><span class="ico">🚻</span><span class="no">01</span><span class="txt">화장실 점검</span><span class="state">✓ 완료</span></div><div class="task "><span class="ico">🚿</span><span class="no">02</span><span class="txt">샤워실 점검</span><span class="state">실시</span></div><div class="task done"><span class="ico">🏸</span><span class="no">03</span><span class="txt">코트 주변 점검</span><span class="state">✓ 완료</span></div><div class="task done"><span class="ico">🚪</span><span class="no">04</span><span class="txt">탈의실 점검</span><span class="state">✓ 완료</span></div><div class="task done"><span class="ico">🪜</span><span class="no">05</span><span class="txt">복도·계단 점검</span><span class="state">✓ 완료</span></div><div class="task done"><span class="ico">🚪</span><span class="no">06</span><span class="txt">출입구 점검</span><span class="state">✓ 완료</span></div><div class="task "><span class="ico">🏢</span><span class="no">07</span><span class="txt">시설물 상태 확인</span><span class="state">실시</span></div><div class="task done"><span class="ico">💡</span><span class="no">08</span><span class="txt">조명 상태 확인</span><span class="state">✓ 완료</span></div><div class="task done"><span class="ico">🧹</span><span class="no">09</span><span class="txt">청소 상태 확인</span><span class="state">✓ 완료</span></div><div class="task done"><span class="ico">⚠️</span><span class="no">10</span><span class="txt">안전 위험요소 확인</span><span class="state">✓ 완료</span></div></div><div class="foot"><span>실시한 항목만 실적 반영
