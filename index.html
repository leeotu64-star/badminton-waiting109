<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f7fb">
<title>장군봉체육관 시설 접수</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:#f5f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  color:#17191d;
}
.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 28px;
}
.top{
  padding:8px 4px 22px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
}
.icon{
  width:44px;height:44px;
  border-radius:14px;
  background:#17191d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
}
.brand b{font-size:17px;letter-spacing:-.5px}
.brand span{
  display:block;
  margin-top:3px;
  color:#8b919b;
  font-size:12px;
}
.hero{
  padding:0 4px 24px;
}
.hero h1{
  margin:0;
  font-size:30px;
  line-height:1.18;
  letter-spacing:-1.5px;
}
.hero p{
  margin:9px 0 0;
  color:#777e89;
  font-size:14px;
  line-height:1.5;
}
.card{
  background:#fff;
  border:1px solid #e9ecf1;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 28px rgba(30,40,60,.07);
}
.field{margin-bottom:22px}
.label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  font-size:14px;
  font-weight:750;
  letter-spacing:-.3px;
}
.required{color:#e5484d;font-size:11px}
select,textarea,button{
  width:100%;
  font-family:inherit;
  -webkit-appearance:none;
}
.selectbox{position:relative}
select{
  height:54px;
  padding:0 44px 0 15px;
  border:1px solid #dfe3e9;
  border-radius:15px;
  background:#fafbfc;
  color:#25282e;
  font-size:15px;
  outline:none;
}
.selectbox:after{
  content:"⌄";
  position:absolute;
  right:17px;
  top:12px;
  color:#7c838e;
  font-size:22px;
  pointer-events:none;
}
select:focus,textarea:focus{
  border-color:#17191d;
  background:#fff;
}
textarea{
  display:block;
  min-height:155px;
  padding:15px;
  border:1px solid #dfe3e9;
  border-radius:15px;
  background:#fafbfc;
  resize:none;
  outline:none;
  font-size:15px;
  line-height:1.55;
}
textarea::placeholder{color:#a3a8b0}
.count{
  margin-top:7px;
  text-align:right;
  color:#a0a5ad;
  font-size:11px;
}
button{
  height:56px;
  border:0;
  border-radius:16px;
  background:#17191d;
  color:#fff;
  font-size:16px;
  font-weight:750;
  letter-spacing:-.3px;
  box-shadow:0 7px 16px rgba(20,24,30,.16);
  cursor:pointer;
}
button:active{transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}
.msg{
  display:none;
  margin-top:14px;
  padding:13px 14px;
  border-radius:13px;
  text-align:center;
  font-size:13px;
  line-height:1.4;
}
.ok{display:block;background:#eef9f1;color:#19703a}
.err{display:block;background:#fff0f0;color:#c52e36}
.bottom{
  text-align:center;
  color:#a0a5ad;
  font-size:11px;
  padding:18px 0 0;
}
</style>
</head>

<body>
<div class="page">

  <div class="top">
    <div class="brand">
      <div class="icon">J</div>
      <div>
        <b>장군봉체육관</b>
        <span>직원 시설 접수</span>
      </div>
    </div>
  </div>

  <div class="hero">
    <h1>시설 불편사항<br>간편 접수</h1>
    <p>불편하거나 고장난 시설을 알려주세요.<br>접수된 내용은 관리자 작업관리로 전달됩니다.</p>
  </div>

  <div class="card">
    <div class="field">
      <div class="label">
        <span>신고 위치</span>
        <span class="required">필수</span>
      </div>
      <div class="selectbox">
        <select id="mobileQrPlace">
          <option value="">위치를 선택해주세요</option>
          <option value="남자 샤워실">남자 샤워실</option>
          <option value="여자 샤워실">여자 샤워실</option>
          <option value="여자 화장실">여자 화장실</option>
          <option value="남자 화장실">남자 화장실</option>
          <option value="복도">복도</option>
          <option value="기타">기타</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="label">
        <span>불편사항 / 고장내용</span>
        <span class="required">필수</span>
      </div>
      <textarea id="mobileQrContent" maxlength="500"
        placeholder="예) 여자 샤워실 세면대에서 물이 새고 있습니다."></textarea>
      <div class="count"><span id="count">0</span> / 500</div>
    </div>

    <button id="submitBtn" onclick="addMobileQrIssue()">접수하기</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="bottom">직원 QR 시설 접수</div>
</div>

<script>
const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";
const SUPA=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("mobileQrContent").addEventListener("input",function(){
  document.getElementById("count").textContent=this.value.length;
});

async function addMobileQrIssue(){
  const place=document.getElementById("mobileQrPlace").value;
  const content=document.getElementById("mobileQrContent").value.trim();
  const btn=document.getElementById("submitBtn");
  const msg=document.getElementById("msg");

  msg.className="msg";
  msg.textContent="";

  if(!place){
    msg.className="msg err";
    msg.textContent="신고 위치를 선택해주세요.";
    return;
  }

  if(!content){
    msg.className="msg err";
    msg.textContent="불편사항이나 고장내용을 입력해주세요.";
    return;
  }

  btn.disabled=true;
  btn.textContent="접수 중...";

  const {error}=await SUPA
    .from("requests")
    .insert([{
      category:"시설",
      place:place,
      content:content,
      status:"접수",
      received_at:new Date().toISOString()
    }]);

  btn.disabled=false;
  btn.textContent="접수하기";

  if(error){
    console.error(error);
    msg.className="msg err";
    msg.textContent="접수에 실패했습니다. 잠시 후 다시 시도해주세요.";
    return;
  }

  msg.className="msg ok";
  msg.textContent="접수되었습니다. 관리자 작업관리에서 확인할 수 있습니다.";

  document.getElementById("mobileQrPlace").value="";
  document.getElementById("mobileQrContent").value="";
  document.getElementById("count").textContent="0";
}
</script>
</body>
</html>
