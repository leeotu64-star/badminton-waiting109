<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장군봉체육관 | 스마트폰 간편 접수</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{width:100%;max-width:560px;margin:auto;padding:20px 15px 35px}
.card{background:#fff;border-radius:22px;padding:24px 18px;box-shadow:0 8px 30px rgba(20,40,70,.09)}
.header{text-align:center;margin-bottom:25px}
.header h1{font-size:26px;margin:0 0 8px;font-weight:900}
.header p{margin:0;color:#667085;font-size:15px}
.title{font-size:18px;font-weight:800;margin:0 0 13px}
.place-picker{position:relative}
.place-select{width:100%;height:58px;border:1px solid #d6deea;background:#fff;border-radius:15px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;color:#344054;box-shadow:0 3px 12px rgba(20,40,70,.05);cursor:pointer}
.place-select:focus{outline:none;border-color:#1671d9;box-shadow:0 0 0 4px rgba(22,113,217,.10)}
.place-select.placeholder{color:#98a2b3}
.place-arrow{font-size:18px;color:#667085;transition:transform .2s}
.place-picker.open .place-arrow{transform:rotate(180deg)}
.place-menu{display:none;position:absolute;z-index:20;left:0;right:0;top:66px;background:#fff;border:1px solid #d6deea;border-radius:15px;padding:7px;box-shadow:0 14px 35px rgba(20,40,70,.14);max-height:280px;overflow:auto}
.place-picker.open .place-menu{display:block}
.place{width:100%;border:0;background:#fff;border-radius:11px;padding:13px 14px;text-align:left;font-size:15px;font-weight:700;color:#344054;cursor:pointer}
.place:hover{background:#f4f8fd}
.place.selected{background:#edf6ff;color:#075db8}
.place-check{float:right;font-weight:900;color:#1671d9}
.label{display:block;font-size:17px;font-weight:800;margin:23px 0 10px}
textarea{width:100%;min-height:145px;border:1px solid #d8dee9;border-radius:13px;padding:14px;font-size:16px;line-height:1.55;resize:vertical;outline:none}
textarea:focus{border-color:#1671d9}
.submit{width:100%;border:0;border-radius:13px;background:#1671d9;color:white;font-size:17px;font-weight:900;padding:16px;margin-top:15px}
.submit:disabled{opacity:.55}
.note{margin-top:12px;padding:12px;border-radius:10px;background:#f5f7fa;color:#667085;font-size:13px;line-height:1.5;text-align:center}
.done{text-align:center;padding:35px 5px 20px}
.check{width:62px;height:62px;border-radius:50%;margin:0 auto 17px;background:#e8f7ee;color:#149447;font-size:38px;font-weight:900;line-height:62px}
.done h2{margin:0 0 9px;font-size:23px}
.done p{margin:0;color:#667085;line-height:1.6;font-size:15px}
.again{background:#eef2f7;color:#344054;margin-top:22px}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>

<script>
const SUPABASE_URL="https://uadyitdlyponeilywacr.supabase.co";
const SUPABASE_KEY="sb_publishable_uJl-AIFKhucxDzgst9JxJA_0FjvYKB9";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const PLACES=["남자 샤워실","여자 샤워실","여자 화장실","남자 화장실","복도","코트","휴게실","기타"];
let selectedPlace="";

function showForm(){
  selectedPlace="";
  document.getElementById("app").innerHTML=`
    <div class="header">
      <h1>장군봉체육관</h1>
      <p>스마트폰 간편 접수</p>
    </div>

    <div class="title">시설 이상 신고</div>
    <div class="place-picker" id="placePicker">
      <button class="place-select placeholder" id="placeSelect" type="button" aria-expanded="false">
        <span id="placeText">발생 장소를 선택해 주세요</span><span class="place-arrow">⌄</span>
      </button>
      <div class="place-menu" id="placeMenu">
        ${PLACES.map(p=>`<button class="place" type="button" data-place="${p}">${p}<span class="place-check" hidden>✓</span></button>`).join("")}
      </div>
    </div>

    <label class="label" for="issue">이상 내용을 입력해 주세요</label>
    <textarea id="issue" placeholder="예: 샤워기에서 물이 새고 있습니다."></textarea>

    <button class="submit" id="submit" type="button">접수하기</button>
    <div class="note">접수된 내용은 관리자 작업관리에서 확인 후 조치합니다.</div>
  `;

  const picker=document.getElementById("placePicker");
  const selectBtn=document.getElementById("placeSelect");
  const placeText=document.getElementById("placeText");
  selectBtn.addEventListener("click",()=>{
    const open=picker.classList.toggle("open");
    selectBtn.setAttribute("aria-expanded",open);
  });
  document.querySelectorAll(".place").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedPlace=btn.dataset.place;
      placeText.textContent=selectedPlace;
      selectBtn.classList.remove("placeholder");
      document.querySelectorAll(".place").forEach(b=>{
        b.classList.remove("selected");
        b.querySelector(".place-check").hidden=true;
      });
      btn.classList.add("selected");
      btn.querySelector(".place-check").hidden=false;
      picker.classList.remove("open");
      selectBtn.setAttribute("aria-expanded","false");
    });
  });
  document.addEventListener("click",e=>{
    if(!picker.contains(e.target)){
      picker.classList.remove("open");
      selectBtn.setAttribute("aria-expanded","false");
    }
  });
  document.getElementById("submit").addEventListener("click",submitIssue);
}

async function submitIssue(){
  const btn=document.getElementById("submit");
  const content=document.getElementById("issue").value.trim();

  if(!selectedPlace){alert("발생 장소를 선택해 주세요.");return}
  if(!content){alert("이상 내용을 입력해 주세요.");return}

  btn.disabled=true;
  btn.textContent="접수 중...";

  const {error}=await supabaseClient.from("requests").insert([{
    category:"시설",
    place:selectedPlace,
    content:content,
    status:"접수",
    received_at:new Date().toISOString()
  }]);

  if(error){
    console.error(error);
    alert("접수에 실패했습니다. 잠시 후 다시 시도해 주세요.");
    btn.disabled=false;
    btn.textContent="접수하기";
    return;
  }
  showDone();
}

function showDone(){
  document.getElementById("app").innerHTML=`
    <div class="done">
      <div class="check">✓</div>
      <h2>접수가 완료되었습니다.</h2>
      <p>시설 이상 신고가 관리자에게 전달되었습니다.<br>확인 후 조치하겠습니다.</p>
      <button class="submit again" type="button" onclick="showForm()">추가 접수하기</button>
    </div>
  `;
}

showForm();
</script>
</body>
</html>
